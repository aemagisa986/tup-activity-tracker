<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>University Activity Tracker</title>
<meta name="theme-color" content="#6E1820">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,650&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: maroon masthead with a gold rule and the university seal; gray working surfaces below. Projects is a category-clustered index on the left and the selected project's file on the right. */
/* Palette: maroon (brand, primary actions), gold/yellow (highlights, active nav, today), neutral grays (surfaces, text). */
:root{
  --bg:#F1F1F2; --surface:#FFFFFF; --sunk:#E7E7E9; --ink:#1F1F23; --muted:#5D5D66; --line:#D3D3D8;
  --accent:#7B1C24; --accent-ink:#FFFFFF; --accent-soft:#F4E3E4; --today:#C99700;
  --brand:#6E1820; --brand-2:#8C2530; --brand-ink:#FFFFFF; --brand-muted:#E9C9CC;
  --gold:#F2C230; --gold-ink:#2A2000; --gold-soft:#FBF1CF;
  --ok:#2E7A4D; --ok-soft:#E1F0E6; --warn:#B4570B; --warn-soft:#F8E7D6; --bad:#B0312C; --bad-soft:#F7DEDC; --idle:#62626C; --idle-soft:#E6E6EA;
  --c-academic:#2F5D9E; --c-academic-s:#E1E9F5; --c-research:#6B4A9C; --c-research-s:#ECE5F5;
  --c-extension:#9A5A12; --c-extension-s:#F6E8D4; --c-production:#5F6E12; --c-production-s:#ECEFD8;
  --c-admin:#4A5A6A; --c-admin-s:#E2E7EC;
  --f-display:"Literata", Georgia, "Times New Roman", serif;
  --f-body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141416; --surface:#1D1D20; --sunk:#18181B; --ink:#E9E9EC; --muted:#A2A2AC; --line:#2F2F35;
  --accent:#E8939A; --accent-ink:#2A0A0E; --accent-soft:#3A1E21; --today:#F2C230;
  --brand:#4A1016; --brand-2:#61171E; --brand-ink:#FFFFFF; --brand-muted:#D9B3B7;
  --gold:#F2C230; --gold-ink:#2A2000; --gold-soft:#3A3115;
  --ok:#62C08B; --ok-soft:#1A2E23; --warn:#F0A060; --warn-soft:#3A2717; --bad:#EE8A80; --bad-soft:#3D2120; --idle:#A6A6B0; --idle-soft:#26262B;
  --c-academic:#8AB0E8; --c-academic-s:#1C2638; --c-research:#B9A0E6; --c-research-s:#28213A;
  --c-extension:#E8B060; --c-extension-s:#352816; --c-production:#BCCB62; --c-production-s:#2A2E18;
  --c-admin:#A8BACB; --c-admin-s:#222A32;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141416; --surface:#1D1D20; --sunk:#18181B; --ink:#E9E9EC; --muted:#A2A2AC; --line:#2F2F35;
  --accent:#E8939A; --accent-ink:#2A0A0E; --accent-soft:#3A1E21; --today:#F2C230;
  --brand:#4A1016; --brand-2:#61171E; --brand-ink:#FFFFFF; --brand-muted:#D9B3B7;
  --gold:#F2C230; --gold-ink:#2A2000; --gold-soft:#3A3115;
  --ok:#62C08B; --ok-soft:#1A2E23; --warn:#F0A060; --warn-soft:#3A2717; --bad:#EE8A80; --bad-soft:#3D2120; --idle:#A6A6B0; --idle-soft:#26262B;
  --c-academic:#8AB0E8; --c-academic-s:#1C2638; --c-research:#B9A0E6; --c-research-s:#28213A;
  --c-extension:#E8B060; --c-extension-s:#352816; --c-production:#BCCB62; --c-production-s:#2A2E18;
  --c-admin:#A8BACB; --c-admin-s:#222A32;
  color-scheme:dark }

:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
input,select,textarea{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

.app{display:flex;flex-direction:column;min-height:100%}
.topbar{display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(180deg,var(--brand-2),var(--brand));color:var(--brand-ink);
  border-bottom:4px solid var(--gold);box-shadow:0 1px 0 var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-text{display:flex;flex-direction:column;min-width:0}
.brand h1{font-family:var(--f-display);font-weight:650;font-size:20px;margin:0;letter-spacing:-.01em;line-height:1.2;color:var(--brand-ink)}
.brand-text span{font-size:12px;color:var(--brand-muted)}
.logo{width:46px;height:46px;flex:none;display:inline-flex;align-items:center;justify-content:center}
.logo img{width:100%;height:100%;object-fit:contain}
.logo.has-img{background:#fff;border-radius:50%;padding:3px;box-sizing:border-box;box-shadow:0 0 0 2px var(--gold),0 2px 4px rgb(0 0 0 / .25)}
.printhead .logo.has-img{box-shadow:none;padding:0}
.logo-fb{width:44px;height:44px;border-radius:50%;background:var(--gold);color:var(--brand);border:2px solid var(--brand-ink);
  display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:650;font-size:13px;letter-spacing:.04em}
.nav{display:flex;gap:2px;flex-wrap:wrap;margin-right:auto}
.nav button{border:0;background:none;padding:7px 12px;border-radius:6px;font-weight:600;font-size:13px;color:var(--brand-muted);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.nav button:hover{background:rgb(255 255 255 / .1);color:var(--brand-ink)}
.nav button[aria-current="page"]{background:var(--gold);color:var(--gold-ink)}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-mono)}
.nav .badge{background:#fff;color:var(--brand)}
.nav button[aria-current="page"] .badge{background:var(--brand);color:#fff}
.who{display:flex;align-items:center;gap:8px;font-size:13px;min-width:0;color:var(--brand-ink)}
.who .wn{font-weight:600;line-height:1.2}
.who .wr{font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.who .btn.ghost{color:var(--brand-ink)}
.who .btn.ghost:hover{background:rgb(255 255 255 / .12)}
.notice{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-block:9px;font-size:13px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--warn-soft);color:var(--ink);border-bottom:1px solid var(--line)}
.notice.info{background:var(--gold-soft)}
.notice b{font-weight:700}
.notice .btn{margin-left:auto}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);
  border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;color:var(--ink);text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent;padding:5px 8px}
.btn.ghost:hover{background:var(--sunk)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.view{flex:1;min-height:0;display:flex;flex-direction:column}
.shell{flex:1;display:grid;grid-template-columns:minmax(270px,330px) 1fr;min-height:0}
.index{border-right:1px solid var(--line);background:var(--sunk);display:flex;flex-direction:column;min-width:0}
.index-tools{display:flex;flex-direction:column;gap:10px;padding:16px}
.search,.sel{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.plist{list-style:none;margin:0;padding:0 8px 16px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.ghead{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;padding:14px 12px 4px;display:flex;justify-content:space-between;gap:8px}
.pitem{display:grid;gap:6px;padding:12px;border-radius:var(--r);cursor:pointer;border:1px solid transparent;text-align:left;background:none;width:100%}
.pitem:hover{background:var(--surface)}
.pitem[aria-current="true"]{background:var(--surface);border-color:var(--line);box-shadow:0 1px 2px rgb(0 0 0 / .05)}
.pitem .pt{font-weight:600;line-height:1.3}
.pitem .pm{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);align-items:center;min-width:0}
.pitem .pm>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meter{height:4px;background:var(--line);border-radius:2px;overflow:hidden;display:block}
.meter>i{display:block;height:100%;background:var(--accent);border-radius:2px;max-width:100%}
.meter.warn>i{background:var(--warn)} .meter.bad>i{background:var(--bad)}
.empty-list{padding:24px 16px;color:var(--muted);font-size:13px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-done{color:var(--ok);background:var(--ok-soft)}
.s-ongoing{color:var(--accent);background:var(--accent-soft)}
.s-behind{color:var(--warn);background:var(--warn-soft)}
.s-late{color:var(--bad);background:var(--bad-soft)}
.s-upcoming{color:var(--idle);background:var(--idle-soft)}
.tagline{font-size:11px;font-weight:600;padding:1px 7px;border-radius:4px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.ctag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:4px;white-space:nowrap;letter-spacing:.02em}
.c-academic{color:var(--c-academic);background:var(--c-academic-s)}
.c-research{color:var(--c-research);background:var(--c-research-s)}
.c-extension{color:var(--c-extension);background:var(--c-extension-s)}
.c-production{color:var(--c-production);background:var(--c-production-s)}
.c-admin{color:var(--c-admin);background:var(--c-admin-s)}
.c-none{color:var(--idle);background:var(--idle-soft)}
.cdot{width:8px;height:8px;border-radius:2px;display:inline-block;background:currentColor;margin-right:6px}

.detail{min-width:0;overflow:auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{flex:1;overflow:auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:24px;min-width:0}
.back{display:none}
.phead{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:start}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.phead h2,.ptitle{font-family:var(--f-display);font-weight:650;font-size:clamp(22px,3vw,30px);line-height:1.15;margin:4px 0 8px;text-wrap:balance}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted);align-items:center}
.facts b{color:var(--ink);font-weight:600}
.pdesc{margin:12px 0 0;max-width:65ch;color:var(--ink);white-space:pre-wrap}
.head-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.summary>div{padding:14px 16px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:3px;min-width:0}
.summary>div:first-child{border-left:0}
.summary .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.summary .v{font-family:var(--f-display);font-size:24px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.2;overflow-wrap:anywhere}
.summary .sub{font-size:12px;color:var(--muted)}

.subtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.subtabs button{border:0;background:none;padding:9px 12px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.subtabs button:hover{color:var(--ink)}
.subtabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.subtabs .n{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-weight:500}

section.block{display:flex;flex-direction:column;gap:12px;min-width:0}
.bhead{display:flex;align-items:baseline;gap:8px 12px;flex-wrap:wrap}
.bhead h3{font-family:var(--f-display);font-weight:650;font-size:18px;margin:0}
.bhead .count{color:var(--muted);font-size:13px}
.bhead .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* timeline */
.tl-wrap{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow-x:auto}
.tl{min-width:640px;padding:12px 16px 16px;position:relative}
.tl-grid{display:grid;grid-template-columns:180px 1fr;gap:0 12px}
.tl-scale{position:relative;height:22px;border-bottom:1px solid var(--line)}
.tl-scale span{position:absolute;top:0;font-size:11px;color:var(--muted);transform:translateX(2px);white-space:nowrap}
.tl-scale i{position:absolute;bottom:-1px;width:1px;height:6px;background:var(--line)}
.tl-label{font-size:13px;padding:9px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-track{position:relative;height:40px}
.tl-track .gl{position:absolute;top:0;bottom:0;width:1px;background:var(--line);opacity:.6}
.bar{position:absolute;top:9px;height:16px;border-radius:4px;background:var(--accent-soft);border:1px solid var(--accent);overflow:hidden;min-width:4px}
.bar>i{display:block;height:100%;background:var(--accent)}
.bar.late{border-color:var(--bad);background:var(--bad-soft)}.bar.late>i{background:var(--bad)}
.bar.behind{border-color:var(--warn);background:var(--warn-soft)}.bar.behind>i{background:var(--warn)}
.bar.done{border-color:var(--ok);background:var(--ok)}
.bar.catch{border-style:dashed}
.base{position:absolute;top:29px;height:4px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--muted) 0 4px,transparent 4px 7px);opacity:.7}
.today-line{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--today);pointer-events:none}
.today-tag{position:absolute;top:0;font-size:10px;font-weight:700;color:var(--gold-ink);transform:translateX(4px);text-transform:uppercase;letter-spacing:.06em;background:var(--gold);padding:0 4px;border-radius:3px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg-base{width:22px;height:4px;background:repeating-linear-gradient(90deg,var(--muted) 0 4px,transparent 4px 7px)}
.lg-catch{width:22px;height:10px;border:1px dashed var(--accent);border-radius:3px}
.lg-today{width:0;height:12px;border-left:2px dashed var(--today)}

/* tables */
.table-wrap{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow-x:auto}
table{width:100%;border-collapse:collapse}
.table-wrap table{min-width:720px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
th.num,td.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{font-weight:700;background:var(--sunk)}
.prog{display:flex;align-items:center;gap:8px;min-width:120px}
.prog .meter{flex:1}
.row-actions{display:flex;gap:2px;justify-content:flex-end;flex-wrap:wrap}
.aname{font-weight:600}
.asub{font-size:12px;color:var(--muted)}
td.grp{background:var(--sunk);font-weight:700;font-size:13px}
.rate{font-weight:700}
.rate.ok{color:var(--ok)} .rate.warn{color:var(--warn)} .rate.bad{color:var(--bad)}

/* log & threads */
.log{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.log li{display:grid;grid-template-columns:110px 1fr auto;gap:16px;padding:14px 16px;border-bottom:1px solid var(--line);align-items:start}
.log li:last-child{border-bottom:0}
.log .d{font-size:12px;color:var(--muted);padding-top:2px}
.log .t{white-space:pre-wrap;min-width:0;overflow-wrap:anywhere}
.log .tag{display:inline-block;font-size:12px;color:var(--accent);font-weight:600;margin-bottom:2px}
.log .pg{font-size:12px;color:var(--muted);margin-top:2px}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:20px;color:var(--muted);font-size:13px;background:var(--surface)}

.threads{display:flex;flex-direction:column;gap:10px}
.thread{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);min-width:0}
.thread.attn{border-color:var(--warn)}
.th-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px;cursor:pointer;width:100%;text-align:left;background:none;border:0}
.th-head .subj{font-weight:600;min-width:0;flex:1 1 200px;overflow-wrap:anywhere}
.th-head .when{font-size:12px;color:var(--muted)}
.kind{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:4px}
.k-query{color:var(--warn);background:var(--warn-soft)} .k-message{color:var(--accent);background:var(--accent-soft)} .k-concern{color:var(--idle);background:var(--idle-soft)}
.posts{border-top:1px solid var(--line);padding:6px 14px 14px;display:flex;flex-direction:column;gap:2px}
.post{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.post:last-of-type{border-bottom:0}
.post .who-s{font-weight:600;font-size:13px}
.post .who-s .r{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--c-admin);margin-left:6px}
.post .tm{font-size:12px;color:var(--muted);text-align:right}
.post .tx{grid-column:1/-1;white-space:pre-wrap;overflow-wrap:anywhere}
.th-actions{display:flex;gap:8px;flex-wrap:wrap;padding-top:8px}
.awaiting{font-size:11px;font-weight:700;color:var(--warn)}
.closed{font-size:11px;font-weight:700;color:var(--ok)}

/* admin & reports */
.cats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.catcard{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0;border-top:3px solid currentColor}
.catcard .cn{font-weight:700;font-size:13px;line-height:1.25}
.catcard .big{font-family:var(--f-display);font-size:26px;font-weight:650;color:var(--ink);line-height:1}
.catcard dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:3px 8px;font-size:12px;color:var(--muted)}
.catcard dd{margin:0;color:var(--ink);font-family:var(--f-mono);text-align:right}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.mini{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.mini li{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mini li:last-child{border-bottom:0}
.mini .grow{flex:1 1 180px;min-width:0}
.mini a,.linkish{color:var(--accent);font-weight:600;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.controls .field{min-width:150px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted);border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.rephead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:end}
.rephead h2{font-family:var(--f-display);font-size:24px;margin:0;font-weight:650}

/* screens */
.screen{max-width:560px;margin:8vh auto 0;display:flex;flex-direction:column;gap:14px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.screen h2{font-family:var(--f-display);margin:0;font-size:26px;font-weight:650;text-wrap:balance}
.screen p{margin:0;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px}
.welcome{max-width:560px;margin:8vh auto 0;display:flex;flex-direction:column;gap:12px;align-items:flex-start;color:var(--muted)}
.welcome h2{font-family:var(--f-display);color:var(--ink);margin:0;font-size:24px}
.ann{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;width:100%;color:var(--ink)}
.ann .d{font-size:12px;color:var(--muted)}

/* modal */
.overlay{position:fixed;inset:0;background:rgb(10 16 14 / .45);display:flex;align-items:flex-start;justify-content:center;
  padding:max(40px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));z-index:20;overflow:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:100%;max-width:580px;box-shadow:0 20px 50px rgb(0 0 0 / .25)}
.modal header{padding:16px 20px;border-bottom:1px solid var(--line)}
.modal h3{margin:0;font-family:var(--f-display);font-size:18px;font-weight:650}
.modal form{padding:16px 20px 20px;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.flabel{font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 10px;width:100%}
.field textarea{min-height:90px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.check{display:flex;gap:8px;align-items:center;font-size:13px}
.hint{font-size:12px;color:var(--muted)}
.err{font-size:12px;color:var(--bad)}
.form-actions{display:flex;justify-content:flex-end;gap:8px;padding-top:4px}
input[type=range]{accent-color:var(--accent);padding:0;border:0;background:none}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}

@media (max-width:1000px){ .cats{grid-template-columns:repeat(2,minmax(0,1fr))} .two{grid-template-columns:1fr} }
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .index{border-right:0}
  body.viewing .index{display:none}
  body:not(.viewing) .shell .detail{display:none}
  .back{display:inline-flex;align-self:flex-start}
  .phead{grid-template-columns:1fr}
  .head-actions{justify-content:flex-start}
  .summary{grid-template-columns:repeat(2,minmax(0,1fr))}
  .summary>div:nth-child(3){border-left:0}
  .summary>div:nth-child(n+3){border-top:1px solid var(--line)}
  .log li{grid-template-columns:1fr;gap:4px}
  .row2{grid-template-columns:1fr}
  .row4{grid-template-columns:1fr 1fr}
}
@media (max-width:480px){ .cats{grid-template-columns:1fr} }
@media (prefers-reduced-motion:no-preference){ .pitem,.btn,.nav button{transition:background .12s,border-color .12s} }
.screen .tabs2{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.screen .tabs2 button{border:0;background:none;padding:8px 12px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.screen .tabs2 button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--gold);color:var(--gold-ink);font-weight:700;font-size:12px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.authbrand{display:flex;align-items:center;gap:14px;padding:16px;border-radius:12px;background:linear-gradient(180deg,var(--brand-2),var(--brand));color:var(--brand-ink);border-bottom:4px solid var(--gold)}
.authbrand .logo{width:64px;height:64px}
.authbrand .logo-fb{width:60px;height:60px;font-size:16px}
.authbrand b{font-family:var(--f-display);font-size:18px;font-weight:650;display:block;line-height:1.2}
.authbrand .brand-sub{font-size:12px;color:var(--brand-muted)}
.authbrand .logo-fb{color:var(--brand)}
.printhead{align-items:center;gap:12px;border-bottom:3px solid var(--brand);padding-bottom:8px}
.printhead .logo{width:52px;height:52px}
.printhead b{font-family:var(--f-display);font-size:16px;display:block}
.print-only{display:none}
@media print{
  :root{--bg:#fff;--surface:#fff;--sunk:#f2f2f2;--ink:#000;--muted:#444;--line:#bbb}
  .topbar,#notice,.controls,.rephead .acts,.no-print,.toast{display:none!important}
  .page{overflow:visible;padding:0}
  .app,.view{display:block}
  .print-only{display:flex}
  .table-wrap{overflow:visible;border-color:#999}
  .table-wrap table{min-width:0;font-size:10px}
  th,td{padding:4px 6px}
  tr{break-inside:avoid}
  section.block{break-inside:auto}
}

<body>

<div class="app">
  <div class="topbar">
    <div class="brand"><span id="brandLogo"></span><div class="brand-text"><h1>University Activity Tracker</h1><span>Technological University of the Philippines</span></div></div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="who" id="who"></div>
  </div>
  <div id="notice"></div>
  <div class="view" id="vProjects" hidden>
    <div class="shell">
      <aside class="index">
        <div class="index-tools">
          <input class="search" id="search" type="search" placeholder="Search projects, offices, leaders" aria-label="Search projects">
          <div class="chips" id="scopeChips" role="group" aria-label="Which projects"></div>
          <select class="sel" id="catSel" aria-label="Category"></select>
          <div class="chips" id="chips" role="group" aria-label="Filter by schedule"></div>
          <button class="btn primary" id="newProjectBtn" data-act="new-project">+ New project</button>
        </div>
        <ul class="plist" id="plist"></ul>
      </aside>
      <main class="detail" id="detail"></main>
    </div>
  </div>
  <div class="view" id="vMessages" hidden><div class="page"><div class="inner" id="messagesInner"></div></div></div>
  <div class="view" id="vReports" hidden><div class="page"><div class="inner" id="reportsInner"></div></div></div>
  <div class="view" id="vAdmin" hidden><div class="page"><div class="inner" id="adminInner"></div></div></div>
  <div class="view" id="vScreen" hidden></div>
</div>
<div id="modalRoot"></div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const TODAY = iso(new Date());
const THIS_YEAR = new Date().getFullYear();
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const DAY = 86400000;
const days = (a,b) => Math.round((parse(b)-parse(a))/DAY);
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmt = s => { if(!s) return "—"; const d=parse(s); return MON[d.getMonth()]+" "+d.getDate()+", "+d.getFullYear(); };
const fmtTs = t => { if(!t) return ""; const d=new Date(t); return MON[d.getMonth()]+" "+d.getDate()+", "+d.getFullYear()+" "+pad(d.getHours())+":"+pad(d.getMinutes()); };
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const num = v => { const n = Number(v); return isFinite(n) ? n : 0; };
const peso = n => "₱" + num(n).toLocaleString("en-PH",{minimumFractionDigits:2, maximumFractionDigits:2});
const pct = n => (isFinite(n) ? Math.round(n) : 0) + "%";

const CATS = [
  {k:"academic",   label:"Academic Projects",            short:"Academic"},
  {k:"research",   label:"Research Projects",            short:"Research"},
  {k:"extension",  label:"Community Extension Projects", short:"Extension"},
  {k:"production", label:"Production Projects",          short:"Production"},
  {k:"admin",      label:"Administration Projects",      short:"Administration"}
];
const catOf = k => CATS.find(c => c.k === k);
const catTag = k => { const c = catOf(k); return c ? `<span class="ctag c-${k}">${c.short}</span>` : `<span class="ctag c-none">Uncategorized</span>`; };
const PSTAT = {planning:"Planning", ongoing:"Ongoing", on_hold:"On hold", completed:"Completed", cancelled:"Cancelled"};
const ECLASS = {PS:"Personal Services", MOOE:"Maintenance & Other Operating Expenses", CO:"Capital Outlay"};
const QUARTERS = [["Q1","01-01","03-31"],["Q2","04-01","06-30"],["Q3","07-01","09-30"],["Q4","10-01","12-31"]];

const STATUS = { done:{label:"Completed"}, ongoing:{label:"On track"}, behind:{label:"Behind schedule"}, late:{label:"Overdue"}, upcoming:{label:"Not started"} };
function statusOf(start, end, progress){
  progress = Number(progress)||0;
  if (progress >= 100) return "done";
  if (end && end < TODAY) return "late";
  if (start && start > TODAY) return "upcoming";
  if (start && end) {
    const total = Math.max(1, days(start,end));
    const expected = clamp(days(start,TODAY)/total*100, 0, 100);
    if (progress + 15 < expected) return "behind";
  }
  return "ongoing";
}
const pill = st => `<span class="pill s-${st}">${STATUS[st].label}</span>`;

const COLS = ["projects","activities","accomplishments","targets","budgetLines","expenses","revisions","joinRequests","threads","posts"];
const state = {
  boot:"loading", me:{id:null,name:"",avatarUrl:""}, isAdmin:false, canWrite:true,
  members:[], membersLoaded:false, announcements:[], loaded:new Set(),
  view:"projects", selected:null, tab:"overview", scope:"mine", cat:"all", filter:"all", q:"",
  openThread:null, msgFilter:"attn",
  rep:{year:THIS_YEAR, period:"annual", cat:"all", scope:"mine"}
};
COLS.forEach(c => state[c] = []);
state.authTab = "login"; state.hasUsers = true; state.meActive = true; state.hasLogo = false;

/* University seal: public/logo.svg (or logo.png if that's what's provided); a lettered badge if neither loads. */
let LOGO_SRC = "logo.svg";
const logoHtml = () => `<span class="logo${state.hasLogo ? " has-img" : ""}">${state.hasLogo ? `<img src="${LOGO_SRC}" alt="Technological University of the Philippines seal">` : `<span class="logo-fb" aria-label="TUP">TUP</span>`}</span>`;
(function tryLogo(srcs){ if (!srcs.length) return; const im = new Image(); im.onload = () => { LOGO_SRC = srcs[0]; state.hasLogo = true; render(); }; im.onerror = () => tryLogo(srcs.slice(1)); im.src = srcs[0]; })(["logo.svg","logo.png"]);

/* ---------- server API ---------- */
async function api(method, url, body){
  const opts = {method, credentials:"same-origin", headers:{"X-Requested-With":"uat"}};
  if (body !== undefined) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
  let r;
  try { r = await fetch(url, opts); } catch(e){ const err = new Error("Can't reach the tracker server. Check that it's running and you're on the same network."); err.status = 0; throw err; }
  let j = {}; try { j = await r.json(); } catch(e){}
  if (!r.ok) { const err = new Error(j.error || "The server refused this request."); err.status = r.status; throw err; }
  return j;
}
function upsert(col, doc){
  if (!doc) return;
  const key = col === "announcements" ? "announcements" : col;
  if (!state[key]) return;
  const i = state[key].findIndex(x => x.id === doc.id);
  if (i >= 0) state[key][i] = doc; else state[key].push(doc);
  if (key === "announcements") state.announcements.sort((a,b) => (b.createdAt||0)-(a.createdAt||0));
}
const add = (col, d) => api("POST", "/api/c/"+col, d).then(r => { upsert(col, r.doc); render(); scheduleRefresh(); return r.id; });
const upd = (col, id, d) => api("PATCH", "/api/c/"+col+"/"+id, d).then(r => { upsert(col, r.doc); render(); scheduleRefresh(); });
const del = (col, id) => api("DELETE", "/api/c/"+col+"/"+id).then(() => { if (state[col]) state[col] = state[col].filter(x => x.id !== id); render(); scheduleRefresh(); });
async function write(fn, okMsg){
  try { await fn(); if (okMsg) toast(okMsg); return true; }
  catch(e){
    if (e.status === 401) { toast("Your session ended. Sign in again."); state.boot = "auth"; render(); }
    else toast(e.message || "Couldn't save. Try again.");
    return false;
  }
}

function setMe(me){
  state.me = {id: me.id, name: me.fullName || "", email: me.email || ""};
  state.isAdmin = me.role === "admin";
  state.meActive = me.active !== false;
}
async function init(attempt = 1){
  try {
    const s = await api("GET", "/api/auth/status");
    state.hasUsers = s.hasUsers; state.adminReserved = !!s.adminReserved; state.domains = s.domains || [];
    if (!s.hasUsers) state.authTab = "register";
  } catch(e){
    // The host may still be waking the app up; keep trying for about a minute.
    if ((e.status === 0 || e.status >= 500) && attempt < 12) { state.boot = "waking"; render(); setTimeout(() => init(attempt + 1), 5000); return; }
  }
  try { const r = await api("GET", "/api/me"); setMe(r.me); }
  catch(e){ state.boot = e.status === 401 ? "auth" : "offline"; render(); return; }
  startSession();
}
async function startSession(){
  state.boot = "ok";
  state.scope = state.isAdmin ? "all" : "mine";
  state.rep.scope = state.isAdmin ? "all" : "mine";
  render();
  if (!state.meActive) return;
  await refresh();
  openEvents();
}
let refreshing = false, refreshAgain = false, refreshT = null;
function scheduleRefresh(){ clearTimeout(refreshT); refreshT = setTimeout(refresh, 150); }
async function refresh(){
  if (refreshing) { refreshAgain = true; return; }
  refreshing = true;
  try {
    const r = await api("GET", "/api/data");
    setMe(r.me);
    state.members = r.members;
    COLS.forEach(c => { state[c] = r.data[c] || []; state.loaded.add(c); });
    state.announcements = (r.data.announcements || []).sort((a,b) => (b.createdAt||0)-(a.createdAt||0));
    state.membersLoaded = true;
    if (state.selected && !state.projects.some(p => p.id === state.selected)) state.selected = null;
    render();
  } catch(e){
    if (e.status === 401) { state.boot = "auth"; render(); }
    else if (e.status === 403) { state.meActive = false; render(); }
    else if (e.status === 0) toast(e.message);
  } finally {
    refreshing = false;
    if (refreshAgain) { refreshAgain = false; scheduleRefresh(); }
  }
}
let events = null;
function openEvents(){
  if (events) return;
  if (!window.EventSource) { setInterval(refresh, 15000); return; }
  events = new EventSource("/api/events");
  events.addEventListener("change", scheduleRefresh);
  events.onopen = scheduleRefresh;
  events.onerror = () => {
    // The browser reconnects by itself; if it has given up (e.g. after a server restart), start over.
    if (events && events.readyState === 2) { events = null; setTimeout(() => { if (state.boot === "ok") { openEvents(); scheduleRefresh(); } }, 5000); }
  };
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && state.boot === "ok") scheduleRefresh(); });
async function signOut(){
  try { await api("POST", "/api/auth/logout"); } catch(e){}
  if (events) events.close();
  location.reload();
}

/* ---------- people & access ---------- */
const memberDoc = id => state.members.find(m => m.id === id);
const myDoc = () => memberDoc(state.me.id);
const nameOf = id => { if (!id) return "—"; const m = memberDoc(id); if (m && m.fullName) return m.fullName; if (id === state.me.id) return state.me.name || "You"; return "Unregistered user"; };
const isLeader = p => !!state.me.id && p.leaderId === state.me.id;
const isMember = p => !!state.me.id && (p.memberIds||[]).includes(state.me.id);
const involved = p => isLeader(p) || isMember(p);
const canManage = p => state.canWrite && (state.isAdmin || isLeader(p));
const canUpdate = p => state.canWrite && (canManage(p) || isMember(p));
const leaderLabel = p => p.leaderId ? nameOf(p.leaderId) : (p.lead || "Not assigned");
const myRole = p => isLeader(p) ? "Leader" : isMember(p) ? "Member" : "";
const pendingReq = p => state.joinRequests.find(r => r.projectId === p.id && r.uid === state.me.id && r.status === "pending");

/* ---------- derived ---------- */
const byProj = (col, pid) => state[col].filter(x => x.projectId === pid);
const actsOf = pid => byProj("activities", pid).sort((a,b) => (a.start||"").localeCompare(b.start||"") || (a.createdAt||0)-(b.createdAt||0));
const accsOf = pid => byProj("accomplishments", pid).sort((a,b) => (b.date||"").localeCompare(a.date||"") || (b.createdAt||0)-(a.createdAt||0));
const targetsOf = pid => byProj("targets", pid).sort((a,b) => (a.year||0)-(b.year||0) || (a.createdAt||0)-(b.createdAt||0));
const linesOf = pid => byProj("budgetLines", pid).sort((a,b) => (a.createdAt||0)-(b.createdAt||0));
const expOf = pid => byProj("expenses", pid).sort((a,b) => (b.date||"").localeCompare(a.date||"") || (b.createdAt||0)-(a.createdAt||0));
const revsOf = pid => byProj("revisions", pid).sort((a,b) => (b.at||0)-(a.at||0));
const threadsOf = pid => byProj("threads", pid).sort((a,b) => (b.lastAt||0)-(a.lastAt||0));
const postsOf = tid => state.posts.filter(p => p.threadId === tid).sort((a,b) => (a.at||0)-(b.at||0));
function projProgress(p){
  const acts = actsOf(p.id);
  if (!acts.length) return Number(p.progress)||0;
  return Math.round(acts.reduce((s,a) => s + (Number(a.progress)||0), 0) / acts.length);
}
const projStatus = p => statusOf(p.start, p.end, projProgress(p));
function budgetOf(pid, from, to){
  const alloc = linesOf(pid).reduce((s,l) => s + num(l.allocated), 0);
  const ex = expOf(pid);
  const spentAll = ex.reduce((s,e) => s + num(e.amount), 0);
  const spent = from ? ex.filter(e => e.date >= from && e.date <= to).reduce((s,e) => s + num(e.amount), 0) : spentAll;
  return {alloc, spent, spentAll, bal: alloc - spentAll, rate: alloc ? spentAll/alloc*100 : 0};
}
function threadAttn(t){
  if (t.closed) return false;
  if (state.isAdmin) return t.awaiting === "admin";
  const p = state.projects.find(x => x.id === t.projectId);
  return t.awaiting === "user" && p && involved(p);
}
const attnCount = () => state.threads.filter(threadAttn).length;
function visibleThreads(){
  if (state.isAdmin) return state.threads;
  return state.threads.filter(t => { const p = state.projects.find(x => x.id === t.projectId); return p && involved(p); });
}

/* ---------- render ---------- */
function render(){
  renderNav(); renderNotice();
  const gate = gateScreen();
  const views = {vProjects:"projects", vMessages:"messages", vReports:"reports", vAdmin:"admin"};
  $("#vScreen").hidden = !gate;
  Object.entries(views).forEach(([id,v]) => $("#"+id).hidden = !!gate || state.view !== v);
  if (gate) { if ($("#vScreen").dataset.g !== gate) { $("#vScreen").innerHTML = gate; $("#vScreen").dataset.g = gate; } return; }
  $("#vScreen").dataset.g = "";
  if (state.view === "projects") renderProjects();
  else if (state.view === "messages") renderMessages();
  else if (state.view === "reports") renderReports();
  else if (state.view === "admin" && state.isAdmin) renderAdmin();
}

function gateScreen(){
  if (state.boot === "loading") return `<div class="screen"><h2>Opening the tracker…</h2><p>Connecting to the server.</p></div>`;
  if (state.boot === "waking") return `<div class="screen"><h2>Starting the tracker…</h2><p>The server was idle and is waking up. This usually takes under a minute; the page will open by itself.</p></div>`;
  if (state.boot === "offline") return `<div class="screen"><h2>Can't reach the tracker server</h2><p>Check your internet connection and reload this page. If it still doesn't open, the server may be down; tell the administrator.</p></div>`;
  if (state.boot === "auth") return authScreen();
  if (!state.meActive) return `<div class="screen"><h2>Your account is deactivated</h2><p>An administrator has turned off your access to project records. Contact the planning office if you think this is a mistake.</p><div><button class="btn" data-act="signout">Sign out</button></div></div>`;
  if (!state.membersLoaded) return `<div class="screen"><h2>Opening the tracker…</h2><p>Loading members and projects.</p></div>`;
  return "";
}

function authScreen(){
  setTimeout(bindAuth);
  const reg = state.authTab === "register";
  return `<div class="screen">
    <div class="authbrand">${logoHtml()}<div><b>University Activity Tracker</b><span class="brand-sub">Technological University of the Philippines</span></div></div>
    <h2>${reg ? "Create your account" : "Sign in"}</h2>
    <p>${!state.hasUsers && !state.adminReserved ? "No accounts exist yet. The first person to register becomes the administrator." : reg ? "Register to create projects, join colleagues' projects and report accomplishments." : "Use the email and password you registered with."}
      ${reg && (state.domains||[]).length ? ` Use your university email (${state.domains.map(d => "@" + esc(d)).join(" or ")}).` : ""}</p>

function bindAuth(){
  const f = $("#authForm"); if (!f || f.dataset.bound) return; f.dataset.bound = "1";
  const showErr = msg => { $("#authErr").textContent = msg; $("#authErr").hidden = false; };
  f.addEventListener("submit", async ev => {
    ev.preventDefault();
    const fd = Object.fromEntries(new FormData(f).entries());
    const reg = f.dataset.mode === "register";
    if (reg) {
      const err = !fd.fullName.trim() ? "Enter your full name." : !fd.email.trim() ? "Enter your email." : !fd.office.trim() ? "Enter your college or office."
        : fd.password.length < 8 ? "Use a password of at least 8 characters." : fd.password !== fd.password2 ? "The two passwords don't match." : null;
      if (err) return showErr(err);
    } else if (!fd.email.trim() || !fd.password) return showErr("Enter your email and password.");
    $("#authBtn").disabled = true;
    try {
      const r = reg ? await api("POST", "/api/auth/register", {fullName:fd.fullName, email:fd.email, office:fd.office, position:fd.position, phone:fd.phone, password:fd.password})
                    : await api("POST", "/api/auth/login", {email:fd.email, password:fd.password});
      setMe(r.me);
      toast(reg ? (state.isAdmin ? "Registered. You're the administrator." : "Registered. Welcome!") : "Signed in");
      startSession();
    } catch(e){ showErr(e.message); $("#authBtn").disabled = false; }
  });
}

function timeline(p, acts){
  const all = [p, ...acts];
  const starts = all.flatMap(r => [r.start, r.baseStart]).filter(Boolean).sort();
  const ends = all.flatMap(r => [r.end, r.baseEnd]).filter(Boolean).sort();
  if (!starts.length || !ends.length) return `<div class="empty">Add start and end dates to see the schedule.</div>`;
  const s0 = starts[0], e0 = ends[ends.length-1];
  const span = Math.max(1, days(s0, e0) + 1);
  const pos = d => clamp(days(s0, d) / span * 100, 0, 100);
  const ticks = []; const first = parse(s0); let m = new Date(first.getFullYear(), first.getMonth(), 1);
  const months = []; while (iso(m) <= e0) { months.push(new Date(m)); m = new Date(m.getFullYear(), m.getMonth()+1, 1); }
  const step = Math.max(1, Math.ceil(months.length / 10));
  months.forEach((d,i) => { if (i % step) return; const k = iso(d) < s0 ? s0 : iso(d);
    ticks.push({x:pos(k), label: MON[d.getMonth()] + (d.getMonth()===0 || i===0 ? " " + d.getFullYear() : "")}); });
  const showToday = TODAY >= s0 && TODAY <= e0;
  const tx = pos(TODAY);
  const rows = [{name:"Whole project", start:p.start, end:p.end, baseStart:p.baseStart, baseEnd:p.baseEnd, progress:projProgress(p), strong:true}, ...acts];
  const gl = ticks.map(t => `<span class="gl" style="left:${t.x}%"></span>`).join("");
  return `<div class="tl-wrap"><div class="tl"><div class="tl-grid">
    <div></div>
    <div class="tl-scale">${ticks.map(t => `<span style="left:${t.x}%">${t.label}</span><i style="left:${t.x}%"></i>`).join("")}
      ${showToday ? `<span class="today-tag" style="left:${tx}%">Today</span>` : ""}</div>
    ${rows.map(r => {
      const st = statusOf(r.start, r.end, r.progress);
      const ok = r.start && r.end;
      const L = ok ? pos(r.start) : 0, W = ok ? Math.max(0.6, (days(r.start, r.end)+1)/span*100) : 0;
      const rev = r.baseStart && r.baseEnd && (r.baseStart !== r.start || r.baseEnd !== r.end);
      const BL = rev ? pos(r.baseStart) : 0, BW = rev ? Math.max(0.6, (days(r.baseStart, r.baseEnd)+1)/span*100) : 0;
      return `<div class="tl-label" title="${esc(r.name)}" style="${r.strong?"font-weight:700":""}">${esc(r.name)}</div>
        <div class="tl-track">${gl}${ok ? `<div class="bar ${st} ${r.catchUp?"catch":""}" style="left:${L}%;width:${Math.min(W,100-L)}%" title="${esc(r.name)}: ${fmt(r.start)} – ${fmt(r.end)}, ${Number(r.progress)||0}%"><i style="width:${Number(r.progress)||0}%"></i></div>` : ""}
        ${rev ? `<span class="base" style="left:${BL}%;width:${Math.min(BW,100-BL)}%" title="Original: ${fmt(r.baseStart)} – ${fmt(r.baseEnd)}"></span>` : ""}
        ${showToday ? `<span class="today-line" style="left:${tx}%"></span>` : ""}</div>`;
    }).join("")}
  </div></div></div>`;
}

function rateClass(r){ return r >= 100 ? "ok" : r >= 75 ? "" : r >= 50 ? "warn" : "bad"; }
function tabTargets(p){
  const ts = targetsOf(p.id), M = canManage(p), U = canUpdate(p);

      <tbody>${ts.map(t => {
        const T = (t.q||[]).reduce((s,v)=>s+num(v),0), A = (t.a||[]).reduce((s,v)=>s+num(v),0);

        return `<tr><td><div class="aname">${esc(t.indicator)}</div><div class="asub">${esc(t.unit||"")}</div></td>

/* ----- Reports ----- */
function periodRange(){
  const y = state.rep.year, p = state.rep.period;
  if (p === "annual") return [y+"-01-01", y+"-12-31", "Annual " + y];
  const q = QUARTERS.find(x => x[0] === p);
  return [y+"-"+q[1], y+"-"+q[2], q[0] + " " + y];
}
function reportRows(){
  const [from, to] = periodRange();
  const qi = state.rep.period === "annual" ? [0,1,2,3] : [Number(state.rep.period[1])-1];
  const projs = state.projects.filter(p => (state.rep.scope === "all" || involved(p)))
    .filter(p => state.rep.cat === "all" || (p.category||"none") === state.rep.cat)
    .filter(p => (!p.start || p.start <= to) && (!p.end || p.end >= from));
  return projs.map(p => {
    const ts = targetsOf(p.id).filter(t => Number(t.year) === Number(state.rep.year));
    const tRows = ts.map(t => {
      const T = qi.reduce((s,i)=>s+num((t.q||[])[i]),0), A = qi.reduce((s,i)=>s+num((t.a||[])[i]),0);
      return {indicator:t.indicator, unit:t.unit||"", T, A, rate: T ? A/T*100 : null};
    });
    const rated = tRows.filter(r => r.rate != null);
    const rate = rated.length ? rated.reduce((s,r)=>s+Math.min(r.rate,100),0)/rated.length : null;
    const b = budgetOf(p.id, from, to);
    const latest = accsOf(p.id).find(a => a.date >= from && a.date <= to);
    return {p, tRows, rate, b, latest, health: projStatus(p), progress: projProgress(p)};
  });
}

function reportMatrix(){
  const [from, to, label] = periodRange();
  const head = ["Category","Project","Office/Unit","Leader","Success indicator","Unit","Target","Actual","Rate %","Allocated (PHP)","Utilized in period (PHP)","Schedule status","Progress %","Reported status","Latest update"];
  const out = [head];
  reportRows().sort((a,b) => CATS.findIndex(c=>c.k===a.p.category) - CATS.findIndex(c=>c.k===b.p.category)).forEach(r => {
    const base = [catOf(r.p.category)?.label || "Uncategorized", r.p.title, r.p.unit||"", leaderLabel(r.p)];
    const tail = [r.b.alloc.toFixed(2), r.b.spent.toFixed(2), STATUS[r.health].label, r.progress, PSTAT[r.p.status]||"", r.latest ? r.latest.text : ""];
    if (!r.tRows.length) out.push([...base, "", "", "", "", "", ...tail]);
    r.tRows.forEach(t => out.push([...base, t.indicator, t.unit, t.T, t.A, t.rate!=null?Math.round(t.rate):"", ...tail]));
  });
  return {out, label};
}

      <dt>Allocated</dt><dd>${peso(s.alloc)}</dd><dt>Utilized</dt><dd>${s.alloc?pct(s.spent/s.alloc*100):"—"}</dd></dl></div>`).join("")}</div>
    ${uncats.length ? `<div class="notice" style="border:1px solid var(--line);border-radius:var(--r)"><span><b>${uncats.length} project${uncats.length===1?"":"s"} without a category.</b> Open each and use Edit to assign one of the five categories so it appears in reports.</span><button class="btn sm" data-act="show-uncat">Show them</button></div>` : ""}
    <div class="two">
      <section class="block"><div class="bhead"><h3>Behind or overdue</h3><span class="count">${risky.length}</span></div>
        ${risky.length ? `<ul class="mini">${risky.slice(0,8).map(p => `<li><div class="grow"><button class="linkish" data-act="goto-project" data-id="${p.id}">${esc(p.title)}</button><div class="asub">${esc(leaderLabel(p))} · ends ${fmt(p.end)} · ${projProgress(p)}%</div></div>${pill(projStatus(p))}</li>`).join("")}</ul>` : `<div class="empty">Every active project is on schedule.</div>`}
      </section>
      <section class="block"><div class="bhead"><h3>Replies awaiting you</h3><span class="count">${awaiting.length}</span></div>
        ${awaiting.length ? `<ul class="mini">${awaiting.slice(0,8).map(t => `<li><div class="grow"><button class="linkish" data-act="goto-thread" data-id="${t.id}">${esc(t.subject)}</button><div class="asub">${esc(pTitle(t.projectId))} · ${esc(fmtTs(t.lastAt))}</div></div></li>`).join("")}</ul>` : `<div class="empty">No replies or concerns are waiting on you.</div>`}

        ${silent.length ? `<ul class="mini">${silent.slice(0,8).map(p => { const a = accsOf(p.id)[0]; return `<li><div class="grow"><button class="linkish" data-act="goto-project" data-id="${p.id}">${esc(p.title)}</button><div class="asub">${a ? "Last update " + fmt(a.date) : "No updates posted"} · ${esc(leaderLabel(p))}</div></div><button class="btn sm" data-act="quick-query" data-id="${p.id}">Send query</button></li>`; }).join("")}</ul>` : `<div class="empty">All started projects have a recent update.</div>`}

      <section class="block"><div class="bhead"><h3>Recent timeline changes</h3><span class="count">${state.revisions.length}</span></div>
        ${recentRevs.length ? `<ul class="mini">${recentRevs.map(r => `<li><div class="grow"><button class="linkish" data-act="goto-project" data-id="${r.projectId}">${esc(pTitle(r.projectId))}</button><div class="asub">${r.kind==="catchup"?"Catch-up added":"Revised"} to ${fmt(r.newStart)} – ${fmt(r.newEnd)} · <span data-text="${esc(r.reason)}"></span></div></div></li>`).join("")}</ul>` : `<div class="empty">No dates have been revised.</div>`}
      </section>
    </div>
    <section class="block"><div class="bhead"><h3>Registered users</h3><span class="count">${members.length}</span></div>
      ${members.length ? `<div class="table-wrap"><table>

            <button class="btn ghost" data-act="toggle-role" data-id="${m.id}">${m.role==="admin"?"Make user":"Make admin"}</button>

      : `<div class="empty">No one else has registered yet. Give faculty and staff this tracker's address so they can register. You can make any of them an administrator from this table.</div>`}
    </section>

      : `<div class="empty">Post deadlines and reminders for all users, such as “Q4 accomplishment reports are due December 15.” The latest one shows as a banner for every user.</div>`}
    </section>`;
  $("#adminInner").querySelectorAll("[data-text]").forEach(n => { n.textContent = n.dataset.text; });

/* ---------- modals ---------- */
function modal(title, body, onSubmit, submitLabel){
  const root = $("#modalRoot");
  root.innerHTML = `<div class="overlay" data-act="close-overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <header><h3 id="mTitle">${title}</h3></header>
    <form id="mForm" novalidate>${body}<div class="err" id="mErr" hidden></div>
    <div class="form-actions"><button type="button" class="btn" data-act="close">Cancel</button><button type="submit" class="btn primary" id="mSubmit">${submitLabel||"Save"}</button></div></form>
  </div></div>`;
  const form = $("#mForm");
  form.addEventListener("submit", async ev => {
    ev.preventDefault();
    const fd = {};
    new FormData(form).forEach((v,k) => { fd[k] = v; });
    form.querySelectorAll("input[type=checkbox]").forEach(c => { fd[c.name] = c.checked; });
    const err = onSubmit.validate ? onSubmit.validate(fd) : null;
    if (err) { $("#mErr").textContent = err; $("#mErr").hidden = false; return; }
    $("#mSubmit").disabled = true;
    const ok = await onSubmit(fd);
    if (ok !== false) closeModal(); else $("#mSubmit").disabled = false;
  });
  const firstInput = form.querySelector("input:not([type=hidden]),select,textarea"); if (firstInput) firstInput.focus();
}
function closeModal(){ $("#modalRoot").innerHTML = ""; }
const dateErr = (s,e) => !s || !e ? "Enter both a start date and an end date." : (e < s ? "The end date can't be before the start date." : null);
const curProject = () => state.projects.find(x => x.id === state.selected);
const memberOptions = (sel, exclude=[]) => state.members.filter(m => m.active !== false && !exclude.includes(m.id)).sort((a,b)=>(a.fullName||"").localeCompare(b.fullName||"")).map(m => `<option value="${m.id}" ${sel===m.id?"selected":""}>${esc(m.fullName)}${m.office?" — "+esc(m.office):""}</option>`).join("");

function openProject(p){
  p = p || {};
  const isNew = !p.id;
  const fn = async fd => {
    const data = {title:fd.title.trim(), category:fd.category, unit:fd.unit.trim(), fundSource:fd.fundSource.trim(), start:fd.start, end:fd.end, description:fd.description.trim(), status:fd.status};
    if (state.isAdmin && fd.leaderId !== undefined) {
      data.leaderId = fd.leaderId || null;
      if (data.leaderId) data.memberIds = (p.memberIds||[]).filter(x => x !== data.leaderId);
    }
    if (!isNew) {
      if (p.start !== data.start || p.end !== data.end) { if (!p.baseStart) { data.baseStart = p.start; data.baseEnd = p.end; } }
      return write(() => upd("projects", p.id, data), "Project updated");
    }
    Object.assign(data, {createdAt:Date.now(), createdBy:state.me.id, baseStart:data.start, baseEnd:data.end, memberIds:[]});
    if (!state.isAdmin || !data.leaderId) data.leaderId = data.leaderId || (myDoc() ? state.me.id : null);
    let newId;
    const ok = await write(async () => { newId = await add("projects", data); }, "Project created");
    if (ok) { state.selected = newId; state.tab = "overview"; render(); }
    return ok;
  };
  fn.validate = fd => !fd.title.trim() ? "Give the project a title." : (!fd.category ? "Choose a category." : dateErr(fd.start, fd.end));
  const leaderField = state.isAdmin ? `<div class="field"><label for="f-leader">Project leader</label><select id="f-leader" name="leaderId"><option value="">${isNew && myDoc() ? "Me" : "Not assigned"}</option>${memberOptions(p.leaderId)}</select>${p.lead && !p.leaderId ? `<span class="hint">Previously recorded as “${esc(p.lead)}”.</span>` : ""}</div>` : "";
  modal(isNew ? "New project" : "Edit project", `
    <div class="field"><label for="f-title">Project title</label><input id="f-title" name="title" value="${esc(p.title)}" placeholder="e.g. Faculty Research Colloquium 2026"></div>
    <div class="row2">
      <div class="field"><label for="f-cat">Category</label><select id="f-cat" name="category"><option value="">Choose…</option>${CATS.map(c => `<option value="${c.k}" ${p.category===c.k?"selected":""}>${c.label}</option>`).join("")}</select></div>
      <div class="field"><label for="f-status">Implementation status</label><select id="f-status" name="status">${Object.entries(PSTAT).map(([k,l]) => `<option value="${k}" ${(p.status||"planning")===k?"selected":""}>${l}</option>`).join("")}</select></div>
    </div>
    <div class="row2">
      <div class="field"><label for="f-unit">College / office</label><input id="f-unit" name="unit" value="${esc(p.unit ?? (isNew && myDoc() ? myDoc().office : ""))}" placeholder="e.g. College of Engineering"></div>
      <div class="field"><label for="f-fund">Fund source</label><input id="f-fund" name="fundSource" value="${esc(p.fundSource)}" placeholder="e.g. GAA 2026, IGF, external grant"></div>
    </div>
    ${leaderField}
    <div class="row2">
      <div class="field"><label for="f-start">Start date</label><input id="f-start" type="date" name="start" value="${esc(p.start||TODAY)}"></div>
      <div class="field"><label for="f-end">End date</label><input id="f-end" type="date" name="end" value="${esc(p.end)}"></div>
    </div>
    ${!isNew ? `<div class="hint">To move dates because of delays, use “Revise project dates” on the Overview tab so the reason is logged.</div>` : ""}
    <div class="field"><label for="f-desc">Objectives / description</label><textarea id="f-desc" name="description" placeholder="What this project should achieve">${esc(p.description)}</textarea></div>`, fn, isNew ? "Create project" : "Save");
}

function openActivity(a, catchUp){
  const p = curProject(); if (!p) return;
  a = a || {};
  const isNew = !a.id;
  const fn = async fd => {
    const data = {name:fd.name.trim(), assignee:fd.assignee.trim(), start:fd.start, end:fd.end, progress:Number(fd.progress)||0};
    if (!isNew) return write(() => upd("activities", a.id, data), "Sub-activity updated");
    Object.assign(data, {projectId:p.id, createdAt:Date.now(), baseStart:fd.start, baseEnd:fd.end, catchUp:!!catchUp});
    let id;
    const ok = await write(async () => { id = await add("activities", data); }, catchUp ? "Catch-up activity added" : "Sub-activity added");
    if (ok && catchUp) await write(() => add("revisions", {projectId:p.id, activityId:id, kind:"catchup", newStart:fd.start, newEnd:fd.end, reason:fd.reason.trim(), by:state.me.id, at:Date.now()}));
    return ok;
  };
  fn.validate = fd => !fd.name.trim() ? "Name the activity." : (catchUp && !fd.reason.trim() ? "Explain what this catch-up activity recovers." : dateErr(fd.start, fd.end));
  const pr = Number(a.progress)||0;
  modal(catchUp ? "Add catch-up activity" : isNew ? "Add sub-activity" : "Edit sub-activity", `
    ${catchUp ? `<div class="hint">A catch-up activity recovers work that fell behind. It's marked on the schedule and logged under Timeline changes.</div>` : ""}
    <div class="field"><label for="f-name">${catchUp ? "Catch-up activity" : "Sub-activity"}</label><input id="f-name" name="name" value="${esc(a.name)}" placeholder="${catchUp ? "e.g. Saturday make-up training sessions" : "e.g. Secure venue and equipment"}"></div>
    <div class="field"><label for="f-assignee">Assigned to</label><input id="f-assignee" name="assignee" value="${esc(a.assignee)}" placeholder="Person or team"></div>
    <div class="row2">
      <div class="field"><label for="f-astart">Start date</label><input id="f-astart" type="date" name="start" value="${esc(a.start||(catchUp?TODAY:p.start))}"></div>
      <div class="field"><label for="f-aend">End date</label><input id="f-aend" type="date" name="end" value="${esc(a.end||p.end)}"></div>
    </div>
    ${catchUp ? `<div class="field"><label for="f-reason">Reason / what it recovers</label><textarea id="f-reason" name="reason" placeholder="e.g. Recovers 3 sessions lost to typhoon class suspensions in August"></textarea></div>` : `<input type="hidden" name="reason" value="">`}
    <div class="field"><label for="f-prog">Progress: <span class="mono" id="progOut">${pr}%</span></label>
      <input id="f-prog" type="range" name="progress" min="0" max="100" step="5" value="${pr}" oninput="document.getElementById('progOut').textContent=this.value+'%'"></div>
    ${!isNew ? `<div class="hint">To change dates after a delay, use “Revise dates” so the change and its reason are logged.</div>` : `<div class="hint">Project dates: ${fmt(p.start)} – ${fmt(p.end)}</div>`}`, fn);
  if (!isNew) { ["f-astart","f-aend"].forEach(id => { const el = document.getElementById(id); if (el) el.readOnly = true; }); }
}

function openRevise(a){
  const p = curProject(); if (!p) return;
  const target = a || p;
  const fn = async fd => {
    const patch = {start:fd.start, end:fd.end};
    if (!target.baseStart) { patch.baseStart = target.start; patch.baseEnd = target.end; }
    const ok = await write(() => upd(a ? "activities" : "projects", target.id, patch), "Dates revised");
    if (ok) await write(() => add("revisions", {projectId:p.id, activityId:a ? a.id : null, kind:"revise", oldStart:target.start||"", oldEnd:target.end||"", newStart:fd.start, newEnd:fd.end, reason:fd.reason.trim(), by:state.me.id, at:Date.now()}));
    return ok;
  };
  fn.validate = fd => dateErr(fd.start, fd.end) || (fd.start === target.start && fd.end === target.end ? "Change at least one date." : (!fd.reason.trim() ? "Give the reason for the change; the admin sees it." : null));
  modal(a ? "Revise sub-activity dates" : "Revise project dates", `
    <div class="aname">${esc(a ? a.name : p.title)}</div>
    <div class="hint">Current: ${fmt(target.start)} – ${fmt(target.end)}${target.baseStart && (target.baseStart!==target.start||target.baseEnd!==target.end) ? ` · Original: ${fmt(target.baseStart)} – ${fmt(target.baseEnd)}` : ""}</div>
    <div class="row2">
      <div class="field"><label for="f-rs">New start date</label><input id="f-rs" type="date" name="start" value="${esc(target.start)}"></div>
      <div class="field"><label for="f-re">New end date</label><input id="f-re" type="date" name="end" value="${esc(target.end)}"></div>

}

function openAcc(c){

  c = c || {};
  const acts = actsOf(p.id);
  const fn = async fd => {
    const data = {date:fd.date, text:fd.text.trim(), activityId:fd.activityId || null,
      progress: fd.activityId && fd.progress !== "" ? clamp(Number(fd.progress),0,100) : null, projectStatus: fd.projectStatus || null};
    const ok = await write(() => c.id ? upd("accomplishments", c.id, data) : add("accomplishments", {...data, projectId:p.id, by:state.me.id, createdAt:Date.now()}), c.id ? "Update edited" : "Update posted");
