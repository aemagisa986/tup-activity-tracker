<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>University Activity Tracker</title>
<meta name="theme-color" content="#5C141D">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<style>
/* TUP University Activity Tracker — "drafting sheet" system
 * Layout: flat maroon masthead on a gold rule; working areas are ruled sheets, not floating cards.
 *   Each project opens with a title block (the field grid of an engineering drawing) and a slippage
 *   gauge (physical progress vs. time elapsed vs. budget used on one 0–100% scale): the one bold element.
 * Color: maroon = brand and primary actions; gold = "now" (today, time elapsed, current tab);
 *   graphite and steel grays = text and structure. Status colors are separate from the brand.
 * Type: Archivo only; width carries hierarchy (expanded for titles and figures, normal for text,
 *   slightly condensed for dense numbers). Sentence case everywhere; no tracked capitals.
 */
:root{
  --bg:#EDEDF0; --surface:#FFFFFF; --sunk:#F5F5F7; --ink:#232328; --muted:#5F5F69; --line:#D7D7DD; --line-2:#B8B8C1;
  --accent:#7A1F2B; --accent-ink:#FFFFFF; --accent-soft:#F4E5E7;
  --brand:#5C141D; --brand-ink:#FFFFFF; --brand-muted:#E2C2C6;
  --gold:#F2B705; --gold-deep:#B88900; --gold-ink:#2B2100; --gold-soft:#FCF1CC;
  --steel:#6B6F7A;
  --today:var(--gold-deep);
  --ok:#2C7549; --ok-soft:#E2F0E7; --warn:#9A4C06; --warn-soft:#F8E8D7; --bad:#AE2F2A; --bad-soft:#F7DFDD; --idle:#62626C; --idle-soft:#E8E8EC;
  --c-academic:#2F5D9E; --c-academic-s:#E2E9F5; --c-research:#6B4A9C; --c-research-s:#ECE6F5;
  --c-extension:#99580F; --c-extension-s:#F6E9D5; --c-production:#5D6C12; --c-production-s:#ECEFD9;
  --c-admin:#4A5A6A; --c-admin-s:#E3E8ED;
  --f:"Archivo", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --r:3px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#16161A; --surface:#1F1F24; --sunk:#1A1A1F; --ink:#ECECF0; --muted:#A6A6B0; --line:#33333B; --line-2:#4A4A54;
  --accent:#EA97A1; --accent-ink:#2B0A0F; --accent-soft:#3B2025;
  --brand:#3F0D14; --brand-ink:#FFFFFF; --brand-muted:#D8B3B8;
  --gold:#F2B705; --gold-deep:#F2B705; --gold-ink:#2B2100; --gold-soft:#3A3013;
  --steel:#9EA3AE;
  --ok:#66C28F; --ok-soft:#1B2F24; --warn:#F0A464; --warn-soft:#3A2818; --bad:#EF8C82; --bad-soft:#3E2221; --idle:#A8A8B2; --idle-soft:#28282E;
  --c-academic:#8AB0E8; --c-academic-s:#1C2638; --c-research:#B9A0E6; --c-research-s:#28213A;
  --c-extension:#E8B060; --c-extension-s:#352816; --c-production:#BCCB62; --c-production-s:#2A2E18;
  --c-admin:#A8BACB; --c-admin-s:#222A32;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#16161A; --surface:#1F1F24; --sunk:#1A1A1F; --ink:#ECECF0; --muted:#A6A6B0; --line:#33333B; --line-2:#4A4A54;
  --accent:#EA97A1; --accent-ink:#2B0A0F; --accent-soft:#3B2025;
  --brand:#3F0D14; --brand-ink:#FFFFFF; --brand-muted:#D8B3B8;
  --gold:#F2B705; --gold-deep:#F2B705; --gold-ink:#2B2100; --gold-soft:#3A3013;
  --steel:#9EA3AE;
  --ok:#66C28F; --ok-soft:#1B2F24; --warn:#F0A464; --warn-soft:#3A2818; --bad:#EF8C82; --bad-soft:#3E2221; --idle:#A8A8B2; --idle-soft:#28282E;
  --c-academic:#8AB0E8; --c-academic-s:#1C2638; --c-research:#B9A0E6; --c-research-s:#28213A;
  --c-extension:#E8B060; --c-extension-s:#352816; --c-production:#BCCB62; --c-production-s:#2A2E18;
  --c-admin:#A8BACB; --c-admin-s:#222A32;
  color-scheme:dark }

:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
input,select,textarea{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.5;font-stretch:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-variant-numeric:tabular-nums;font-stretch:94%}
.muted{color:var(--muted)}
h1,h2,h3{font-family:var(--f)}

/* masthead */
.app{display:flex;flex-direction:column;min-height:100%}
.topbar{display:flex;align-items:stretch;gap:0 28px;flex-wrap:wrap;min-height:64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--brand);color:var(--brand-ink);border-bottom:3px solid var(--gold)}
.brand{display:flex;align-items:center;gap:12px;min-width:0;padding-block:9px}
.brand-text{display:flex;flex-direction:column;min-width:0}
.brand h1{font-weight:700;font-stretch:116%;font-size:18px;margin:0;line-height:1.15;color:var(--brand-ink);letter-spacing:-.005em}
.brand-text span{font-size:12px;color:var(--brand-muted)}
.logo{width:44px;height:44px;flex:none;display:inline-flex;align-items:center;justify-content:center}
.logo img{width:100%;height:100%;object-fit:contain}
.logo.has-img{background:#fff;border-radius:50%;padding:3px;box-sizing:border-box;box-shadow:0 0 0 2px var(--gold)}
.logo-fb{width:42px;height:42px;border-radius:50%;background:var(--gold);color:var(--brand);border:2px solid #fff;
  display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-stretch:112%;font-size:12px}
.nav{display:flex;gap:4px;flex-wrap:wrap;margin-right:auto;align-items:stretch}
.nav button{border:0;background:none;padding:0 12px;min-height:44px;font-weight:600;font-size:14px;color:var(--brand-muted);cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.nav button:hover{color:var(--brand-ink);background:rgb(255 255 255 / .06)}
.nav button[aria-current="page"]{color:var(--brand-ink);box-shadow:inset 0 -5px 0 var(--gold)}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.nav .badge{background:var(--gold);color:var(--gold-ink)}
.who{display:flex;align-items:center;gap:10px;font-size:13px;min-width:0;color:var(--brand-ink);padding-block:9px}
.who .wn{font-weight:600;line-height:1.2}
.who .wr{font-size:12px;color:var(--brand-muted)}
.who .btn.ghost{color:var(--brand-ink)}
.who .btn.ghost:hover{background:rgb(255 255 255 / .1)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--gold);color:var(--gold-ink);font-weight:700;font-size:12px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.notice{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-block:10px;font-size:13px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--warn-soft);color:var(--ink);border-bottom:1px solid var(--line)}
.notice.info{background:var(--gold-soft)}
.notice b{font-weight:700}
.notice .btn{margin-left:auto}

/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);
  border-radius:var(--r);padding:7px 13px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;color:var(--ink);text-decoration:none;line-height:1.3}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 86%,#000)}
.btn.danger{color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent;padding:5px 8px}
.btn.ghost:hover{background:var(--sunk);border-color:transparent}
.btn.sm{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.search,.sel{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:8px 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:3px 9px;font-size:12px;font-weight:600;cursor:pointer;color:var(--muted);display:inline-flex;gap:6px}
.chip .mono{font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted);border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg.wrap{flex-wrap:wrap}

/* shell: project index + project file */
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.shell{flex:1;display:grid;grid-template-columns:minmax(280px,340px) 1fr;min-height:0}
.index{border-right:1px solid var(--line);background:var(--sunk);display:flex;flex-direction:column;min-width:0}
.index-tools{display:flex;flex-direction:column;gap:10px;padding:16px;border-bottom:1px solid var(--line)}
.plist{list-style:none;margin:0;padding:0 0 24px;display:flex;flex-direction:column;overflow:auto}
.ghead{font-size:13px;font-weight:700;padding:16px 16px 6px;display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--ink)}
.ghead .gname{display:inline-flex;align-items:center;gap:8px}
.ghead .mono{color:var(--muted);font-weight:500}
.cdot{width:9px;height:9px;border-radius:1px;display:inline-block;background:currentColor;flex:none}
.pitem{display:grid;gap:5px;padding:11px 16px 12px 13px;cursor:pointer;border:0;border-left:3px solid transparent;border-bottom:1px solid var(--line);text-align:left;background:none;width:100%}
.plist li:nth-child(2) .pitem, .ghead + li .pitem{border-top:1px solid var(--line)}
.pitem:hover{background:var(--surface)}
.pitem[aria-current="true"]{background:var(--surface);border-left-color:var(--accent)}
.pitem .pt{font-weight:600;line-height:1.3}
.pitem .pm{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);align-items:center;min-width:0}
.pitem .pm>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mg{position:relative;height:6px;background:var(--line);display:block;margin-block:3px}
.mg>i{display:block;height:100%;background:var(--accent);max-width:100%}
.mg>b{position:absolute;top:-3px;width:2px;height:12px;background:var(--gold-deep);transform:translateX(-1px)}
.slip{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.slip.ok{color:var(--ok)} .slip.warn{color:var(--warn)} .slip.bad{color:var(--bad)}
.meter{height:5px;background:var(--line);overflow:hidden;display:block}
.meter>i{display:block;height:100%;background:var(--accent);max-width:100%}
.meter.warn>i{background:var(--warn)} .meter.bad>i{background:var(--bad)}
.empty-list{padding:24px 16px;color:var(--muted);font-size:13px}

/* status and tags */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:1px 9px 1px 7px;border-radius:999px;white-space:nowrap;line-height:1.6}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-done{color:var(--ok);background:var(--ok-soft)}
.s-ongoing{color:var(--accent);background:var(--accent-soft)}
.s-behind{color:var(--warn);background:var(--warn-soft)}
.s-late{color:var(--bad);background:var(--bad-soft)}
.s-upcoming{color:var(--idle);background:var(--idle-soft)}
.tagline{font-size:12px;font-weight:500;padding:0 6px;border-radius:var(--r);border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
.ctag{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;white-space:nowrap;background:none!important}
.ctag::before{content:"";width:9px;height:9px;border-radius:1px;background:currentColor}
.c-academic{color:var(--c-academic);background:var(--c-academic-s)}
.c-research{color:var(--c-research);background:var(--c-research-s)}
.c-extension{color:var(--c-extension);background:var(--c-extension-s)}
.c-production{color:var(--c-production);background:var(--c-production-s)}
.c-admin{color:var(--c-admin);background:var(--c-admin-s)}
.c-none{color:var(--idle);background:var(--idle-soft)}

/* project file */
.detail{min-width:0;overflow:auto;padding-block:28px 56px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.page{flex:1;overflow:auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:22px;min-width:0}
.back{display:none}
.phead{display:grid;grid-template-columns:1fr auto;gap:16px 24px;align-items:start}
.phead h2,.ptitle{font-weight:700;font-stretch:114%;font-size:clamp(24px,3.1vw,34px);line-height:1.08;margin:0;letter-spacing:-.015em;text-wrap:balance}
.pdesc{margin:0;max-width:72ch;color:var(--ink);white-space:pre-wrap}
.head-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

/* title block: one ruled field grid, like the title block of a drawing */
.tblock{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line-2);border-left:1px solid var(--line-2);background:var(--surface)}
.tblock>div{padding:9px 14px 10px;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);display:flex;flex-direction:column;gap:2px;min-width:0}
.tb-k{font-size:12px;color:var(--muted)}
.tb-v{font-weight:600;overflow-wrap:anywhere}
.tb-sub{display:block;font-size:12px;color:var(--muted);font-weight:400}
.tblock .ctag{white-space:normal;align-items:baseline}

/* slippage gauge */
.gauge{display:grid;grid-template-columns:minmax(200px,250px) 1fr;border:1px solid var(--line-2);background:var(--surface)}
.g-slip{padding:16px 20px 18px;border-right:1px solid var(--line-2);display:flex;flex-direction:column;gap:2px;justify-content:center}
.g-k{font-size:13px;font-weight:600;color:var(--muted)}
.g-n{font-size:52px;font-weight:750;font-stretch:120%;line-height:.95;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:4px}
.g-u{font-size:12px;color:var(--muted)}
.g-v{font-weight:700;margin-top:6px}
.g-slip.ok .g-n,.g-slip.ok .g-v{color:var(--ok)}
.g-slip.warn .g-n,.g-slip.warn .g-v{color:var(--warn)}
.g-slip.bad .g-n,.g-slip.bad .g-v{color:var(--bad)}
.g-bars{padding:16px 20px 12px;display:flex;flex-direction:column;gap:11px;min-width:0}
.g-row{display:grid;grid-template-columns:128px minmax(0,1fr) 68px;align-items:center;gap:14px}
.g-lab{font-size:13px;font-weight:600}
.g-val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.g-track{position:relative;height:14px;background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line)}
.g-track>i{display:block;height:100%}
.g-track>i.phys{background:var(--accent)}
.g-track>i.time{background:var(--gold)}
.g-track>i.fin{background:var(--steel)}
.g-track>b{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--gold-deep);transform:translateX(-1px)}
.g-scale{display:grid;grid-template-columns:128px minmax(0,1fr) 68px;gap:14px;font-size:11px;color:var(--muted)}
.g-ticks{position:relative;height:14px}
.g-ticks span{position:absolute;transform:translateX(-50%);font-variant-numeric:tabular-nums}
.g-ticks span:first-child{transform:none}
.g-ticks span:last-child{transform:translateX(-100%)}
.g-note{font-size:12px;color:var(--muted)}

/* budget figures */
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line-2);background:var(--surface)}
.summary>div{padding:12px 16px;border-left:1px solid var(--line-2);display:flex;flex-direction:column;gap:3px;min-width:0}
.summary>div:first-child{border-left:0}
.summary .k{font-size:12px;color:var(--muted)}
.summary .v{font-size:22px;font-weight:700;font-stretch:108%;font-variant-numeric:tabular-nums;line-height:1.2;overflow-wrap:anywhere}
.summary .sub{font-size:12px;color:var(--muted)}

.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line-2);overflow-x:auto}
.subtabs button{border:0;background:none;padding:10px 12px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.subtabs button:hover{color:var(--ink)}
.subtabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.subtabs .n{font-size:12px;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}

section.block{display:flex;flex-direction:column;gap:12px;min-width:0}
.bhead{display:flex;align-items:baseline;gap:8px 12px;flex-wrap:wrap}
.bhead h3{font-weight:700;font-stretch:108%;font-size:18px;margin:0;letter-spacing:-.005em}
.bhead .count{color:var(--muted);font-size:13px}
.bhead .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* timeline */
.tl-wrap{border:1px solid var(--line-2);background:var(--surface);overflow-x:auto}
.tl{min-width:640px;padding:12px 16px 16px;position:relative}
.tl-grid{display:grid;grid-template-columns:180px 1fr;gap:0 12px}
.tl-scale{position:relative;height:22px;border-bottom:1px solid var(--line)}
.tl-scale span{position:absolute;top:0;font-size:11px;color:var(--muted);transform:translateX(2px);white-space:nowrap}
.tl-scale i{position:absolute;bottom:-1px;width:1px;height:6px;background:var(--line-2)}
.tl-label{font-size:13px;padding:9px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-track{position:relative;height:40px}
.tl-track .gl{position:absolute;top:0;bottom:0;width:1px;background:var(--line);opacity:.7}
.bar{position:absolute;top:10px;height:14px;background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent);overflow:hidden;min-width:4px}
.bar>i{display:block;height:100%;background:var(--accent)}
.bar.late{box-shadow:inset 0 0 0 1px var(--bad);background:var(--bad-soft)}.bar.late>i{background:var(--bad)}
.bar.behind{box-shadow:inset 0 0 0 1px var(--warn);background:var(--warn-soft)}.bar.behind>i{background:var(--warn)}
.bar.done{box-shadow:none;background:var(--ok)}
.bar.catch{background-image:repeating-linear-gradient(135deg,transparent 0 5px,color-mix(in srgb,var(--accent) 18%,transparent) 5px 7px)}
.base{position:absolute;top:28px;height:3px;background:repeating-linear-gradient(90deg,var(--muted) 0 4px,transparent 4px 7px);opacity:.75}
.today-line{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--gold-deep);pointer-events:none}
.tl-scale .today-tag{position:absolute;top:0;font-size:11px;font-weight:700;color:var(--gold-ink);transform:translateX(4px);background:var(--gold);padding:0 5px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg-base{width:22px;height:3px;background:repeating-linear-gradient(90deg,var(--muted) 0 4px,transparent 4px 7px)}
.lg-catch{width:22px;height:10px;box-shadow:inset 0 0 0 1px var(--accent);background-image:repeating-linear-gradient(135deg,transparent 0 3px,color-mix(in srgb,var(--accent) 30%,transparent) 3px 5px)}
.lg-today{width:0;height:12px;border-left:2px solid var(--gold-deep)}

/* tables */
.table-wrap{border:1px solid var(--line-2);background:var(--surface);overflow-x:auto}
table{width:100%;border-collapse:collapse}
.table-wrap table{min-width:720px}
th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line-2);background:var(--sunk);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}

  padding:9px 16px;font-size:13px;font-weight:600;z-index:30;max-width:calc(100% - 32px);border-left:4px solid var(--gold)}

<body>

<div class="app">
  <div class="topbar">
    <div class="brand"><span id="brandLogo"></span><div class="brand-text"><h1>University Activity Tracker</h1><span>Technological University of the Philippines</span></div></div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="who" id="who"></div>
  </div>
  <div id="notice"></div>
  <div class="view" id="vProjects" hidden>
    <div class="shell">
      <aside class="index">
        <div class="index-tools">
          <input class="search" id="search" type="search" placeholder="Search projects, offices, leaders" aria-label="Search projects">
          <div class="chips" id="scopeChips" role="group" aria-label="Which projects"></div>
          <select class="sel" id="catSel" aria-label="Category"></select>
          <div class="chips" id="chips" role="group" aria-label="Filter by schedule"></div>
          <button class="btn primary" id="newProjectBtn" data-act="new-project">+ New project</button>
        </div>

      </aside>
      <main class="detail" id="detail"></main>
    </div>
  </div>
  <div class="view" id="vMessages" hidden><div class="page"><div class="inner" id="messagesInner"></div></div></div>
  <div class="view" id="vReports" hidden><div class="page"><div class="inner" id="reportsInner"></div></div></div>
  <div class="view" id="vAdmin" hidden><div class="page"><div class="inner" id="adminInner"></div></div></div>
  <div class="view" id="vScreen" hidden></div>
</div>
<div id="modalRoot"></div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const TODAY = iso(new Date());
const THIS_YEAR = new Date().getFullYear();
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const DAY = 86400000;
const days = (a,b) => Math.round((parse(b)-parse(a))/DAY);
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmt = s => { if(!s) return "—"; const d=parse(s); return MON[d.getMonth()]+" "+d.getDate()+", "+d.getFullYear(); };
const fmtTs = t => { if(!t) return ""; const d=new Date(t); return MON[d.getMonth()]+" "+d.getDate()+", "+d.getFullYear()+" "+pad(d.getHours())+":"+pad(d.getMinutes()); };
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const num = v => { const n = Number(v); return isFinite(n) ? n : 0; };
const peso = n => "₱" + num(n).toLocaleString("en-PH",{minimumFractionDigits:2, maximumFractionDigits:2});
const pct = n => (isFinite(n) ? Math.round(n) : 0) + "%";

const CATS = [
  {k:"academic",   label:"Academic Projects",            short:"Academic"},
  {k:"research",   label:"Research Projects",            short:"Research"},
  {k:"extension",  label:"Community Extension Projects", short:"Extension"},
  {k:"production", label:"Production Projects",          short:"Production"},
  {k:"admin",      label:"Administration Projects",      short:"Administration"}
];
const catOf = k => CATS.find(c => c.k === k);
const catTag = k => { const c = catOf(k); return c ? `<span class="ctag c-${k}">${c.short}</span>` : `<span class="ctag c-none">Uncategorized</span>`; };
const PSTAT = {planning:"Planning", ongoing:"Ongoing", on_hold:"On hold", completed:"Completed", cancelled:"Cancelled"};
const ECLASS = {PS:"Personal Services", MOOE:"Maintenance & Other Operating Expenses", CO:"Capital Outlay"};
const QUARTERS = [["Q1","01-01","03-31"],["Q2","04-01","06-30"],["Q3","07-01","09-30"],["Q4","10-01","12-31"]];

const STATUS = { done:{label:"Completed"}, ongoing:{label:"On track"}, behind:{label:"Behind schedule"}, late:{label:"Overdue"}, upcoming:{label:"Not started"} };
function statusOf(start, end, progress){
  progress = Number(progress)||0;
  if (progress >= 100) return "done";
  if (end && end < TODAY) return "late";
  if (start && start > TODAY) return "upcoming";
  if (start && end) {
    const total = Math.max(1, days(start,end));
    const expected = clamp(days(start,TODAY)/total*100, 0, 100);
    if (progress + 15 < expected) return "behind";
  }
  return "ongoing";
}
const pill = st => `<span class="pill s-${st}">${STATUS[st].label}</span>`;

const COLS = ["projects","activities","accomplishments","targets","budgetLines","expenses","revisions","joinRequests","threads","posts","settings"];
const state = {
  boot:"loading", me:{id:null,name:"",avatarUrl:""}, isAdmin:false, canWrite:true,
  members:[], membersLoaded:false, announcements:[], loaded:new Set(),
  view:"projects", selected:null, tab:"overview", scope:"mine", cat:"all", filter:"all", q:"",
  openThread:null, msgFilter:"attn",
  rep:{type:"accomplishment", year:THIS_YEAR, period:"annual", from:"", to:"", cat:"all", unit:"all", project:"all", scope:"mine", sig:null, sigOpen:false}
};
COLS.forEach(c => state[c] = []);
state.authTab = "login"; state.hasUsers = true; state.meActive = true; state.hasLogo = false;

/* University seal: public/logo.svg (or logo.png if that's what's provided); a lettered badge if neither loads. */
let LOGO_SRC = "logo.svg";
const logoHtml = () => `<span class="logo${state.hasLogo ? " has-img" : ""}">${state.hasLogo ? `<img src="${LOGO_SRC}" alt="Technological University of the Philippines seal">` : `<span class="logo-fb" aria-label="TUP">TUP</span>`}</span>`;
(function tryLogo(srcs){ if (!srcs.length) return; const im = new Image(); im.onload = () => { LOGO_SRC = srcs[0]; state.hasLogo = true; render(); }; im.onerror = () => tryLogo(srcs.slice(1)); im.src = srcs[0]; })(["logo.svg","logo.png"]);

/* ---------- server API ---------- */
async function api(method, url, body){
  const opts = {method, credentials:"same-origin", headers:{"X-Requested-With":"uat"}};
  if (body !== undefined) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
  let r;
  try { r = await fetch(url, opts); } catch(e){ const err = new Error("Can't reach the tracker server. Check that it's running and you're on the same network."); err.status = 0; throw err; }
  let j = {}; try { j = await r.json(); } catch(e){}
  if (!r.ok) { const err = new Error(j.error || "The server refused this request."); err.status = r.status; throw err; }
  return j;

let refreshing = false, refreshAgain = false, refreshT = null;

    COLS.forEach(c => { state[c] = r.data[c] || []; state.loaded.add(c); });
    state.announcements = (r.data.announcements || []).sort((a,b) => (b.createdAt||0)-(a.createdAt||0));
    state.membersLoaded = true;
    if (state.selected && !state.projects.some(p => p.id === state.selected)) state.selected = null;

const byProj = (col, pid) => state[col].filter(x => x.projectId === pid);
const actsOf = pid => byProj("activities", pid).sort((a,b) => (a.start||"").localeCompare(b.start||"") || (a.createdAt||0)-(b.createdAt||0));
const accsOf = pid => byProj("accomplishments", pid).sort((a,b) => (b.date||"").localeCompare(a.date||"") || (b.createdAt||0)-(a.createdAt||0));
const targetsOf = pid => byProj("targets", pid).sort((a,b) => (a.year||0)-(b.year||0) || (a.createdAt||0)-(b.createdAt||0));
const linesOf = pid => byProj("budgetLines", pid).sort((a,b) => (a.createdAt||0)-(b.createdAt||0));
const expOf = pid => byProj("expenses", pid).sort((a,b) => (b.date||"").localeCompare(a.date||"") || (b.createdAt||0)-(a.createdAt||0));
const revsOf = pid => byProj("revisions", pid).sort((a,b) => (b.at||0)-(a.at||0));
const threadsOf = pid => byProj("threads", pid).sort((a,b) => (b.lastAt||0)-(a.lastAt||0));
const postsOf = tid => state.posts.filter(p => p.threadId === tid).sort((a,b) => (a.at||0)-(b.at||0));
function projProgress(p){
  const acts = actsOf(p.id);
  if (!acts.length) return Number(p.progress)||0;
  return Math.round(acts.reduce((s,a) => s + (Number(a.progress)||0), 0) / acts.length);
}
const projStatus = p => statusOf(p.start, p.end, projProgress(p));
/* Slippage: physical progress minus the share of the schedule already elapsed, in percentage points.
   Negative means the work is behind the calendar. Thresholds match statusOf (15 points = behind). */
function elapsedPct(p){
  if (!p.start || !p.end) return null;
  if (TODAY <= p.start) return 0;
  if (TODAY >= p.end) return 100;
  return clamp(days(p.start, TODAY) / Math.max(1, days(p.start, p.end)) * 100, 0, 100);
}
function slippage(p){ const e = elapsedPct(p); return e == null ? null : projProgress(p) - e; }
const slipText = v => v == null ? "—" : (v > 0.05 ? "+" : v < -0.05 ? "−" : "±") + Math.abs(Math.round(v)).toString();

  if (st === "upcoming") return "Not started yet";
  if (v == null) return "Add start and end dates to measure slippage";
  if (st === "late") return "Past the end date";
  if (v >= 5) return "Ahead of schedule";
  if (v > -5) return "On schedule";
  if (v > -15) return "Slightly behind schedule";
  return "Behind schedule";
}
function gaugeHtml(p){
  const pr = projProgress(p), el = elapsedPct(p), b = budgetOf(p.id), v = slippage(p), st = projStatus(p);
  const ut = b.approved ? clamp(b.rate, 0, 100) : null;
  const mark = el == null ? "" : `<b style="left:${el}%" aria-hidden="true"></b>`;
  const row = (label, val, cls, txt, withMark) => `<div class="g-row"><span class="g-lab">${label}</span><span class="g-track"><i class="${cls}" style="width:${val == null ? 0 : clamp(val,0,100)}%"></i>${withMark ? mark : ""}</span><span class="g-val">${txt}</span></div>`;
  const label = `Slippage ${slipText(v)} points. Physical progress ${pr}%, time elapsed ${el == null ? "unknown" : Math.round(el) + "%"}, budget utilized ${b.approved ? Math.round(b.rate) + "%" : "not recorded"}.`;

/* Budgets are approved before the project starts. The approved budget is the project's
   approvedBudget when recorded; older projects that only have line items use their sum.
   Line items ("allocated") break the approved budget down by expense class; expenses are what was utilized. */
function budgetOf(pid, from, to){
  const p = state.projects.find(x => x.id === pid) || {};
  const lineTotal = linesOf(pid).reduce((s,l) => s + num(l.allocated), 0);
  const approved = num(p.approvedBudget) > 0 ? num(p.approvedBudget) : lineTotal;
  const ex = expOf(pid);
  const sum = list => list.reduce((s,e) => s + num(e.amount), 0);
  const spentAll = sum(ex);
  const spent = from ? sum(ex.filter(e => e.date >= from && e.date <= to)) : spentAll;      // within the period
  const spentToDate = to ? sum(ex.filter(e => e.date <= to)) : spentAll;                    // cumulative, as of the period end
  return {approved, alloc: approved, lineTotal, unallocated: approved - lineTotal, spent, spentAll, spentToDate,
    bal: approved - spentAll, balAsOf: approved - spentToDate,
    rate: approved ? spentAll/approved*100 : 0, rateAsOf: approved ? spentToDate/approved*100 : 0};
}
function classBreakdown(pid, to){
  const lines = linesOf(pid), ex = expOf(pid).filter(e => !to || e.date <= to);
  return Object.keys(ECLASS).map(k => {
    const ls = lines.filter(l => l.cls === k), ids = new Set(ls.map(l => l.id));
    return {cls:k, approved: ls.reduce((s,l)=>s+num(l.allocated),0), utilized: ex.filter(e => ids.has(e.lineId)).reduce((s,e)=>s+num(e.amount),0)};
  });
}

    if (reg) {
      const err = !fd.fullName.trim() ? "Enter your full name." : !fd.email.trim() ? "Enter your email." : !fd.office.trim() ? "Enter your college or office."

function timeline(p, acts){
  const all = [p, ...acts];
  const starts = all.flatMap(r => [r.start, r.baseStart]).filter(Boolean).sort();
  const ends = all.flatMap(r => [r.end, r.baseEnd]).filter(Boolean).sort();
  if (!starts.length || !ends.length) return `<div class="empty">Add start and end dates to see the schedule.</div>`;
  const s0 = starts[0], e0 = ends[ends.length-1];
  const span = Math.max(1, days(s0, e0) + 1);
  const pos = d => clamp(days(s0, d) / span * 100, 0, 100);
  const ticks = []; const first = parse(s0); let m = new Date(first.getFullYear(), first.getMonth(), 1);
  const months = []; while (iso(m) <= e0) { months.push(new Date(m)); m = new Date(m.getFullYear(), m.getMonth()+1, 1); }
  const step = Math.max(1, Math.ceil(months.length / 10));
  months.forEach((d,i) => { if (i % step) return; const k = iso(d) < s0 ? s0 : iso(d);
    ticks.push({x:pos(k), label: MON[d.getMonth()] + (d.getMonth()===0 || i===0 ? " " + d.getFullYear() : "")}); });
  const showToday = TODAY >= s0 && TODAY <= e0;
  const tx = pos(TODAY);
  const rows = [{name:"Whole project", start:p.start, end:p.end, baseStart:p.baseStart, baseEnd:p.baseEnd, progress:projProgress(p), strong:true}, ...acts];
  const gl = ticks.map(t => `<span class="gl" style="left:${t.x}%"></span>`).join("");
  return `<div class="tl-wrap"><div class="tl"><div class="tl-grid">
    <div></div>
    <div class="tl-scale">${ticks.map(t => `<span style="left:${t.x}%">${t.label}</span><i style="left:${t.x}%"></i>`).join("")}
      ${showToday ? `<span class="today-tag" style="left:${tx}%">Today</span>` : ""}</div>
    ${rows.map(r => {
      const st = statusOf(r.start, r.end, r.progress);
      const ok = r.start && r.end;
      const L = ok ? pos(r.start) : 0, W = ok ? Math.max(0.6, (days(r.start, r.end)+1)/span*100) : 0;
      const rev = r.baseStart && r.baseEnd && (r.baseStart !== r.start || r.baseEnd !== r.end);
      const BL = rev ? pos(r.baseStart) : 0, BW = rev ? Math.max(0.6, (days(r.baseStart, r.baseEnd)+1)/span*100) : 0;
      return `<div class="tl-label" title="${esc(r.name)}" style="${r.strong?"font-weight:700":""}">${esc(r.name)}</div>
        <div class="tl-track">${gl}${ok ? `<div class="bar ${st} ${r.catchUp?"catch":""}" style="left:${L}%;width:${Math.min(W,100-L)}%" title="${esc(r.name)}: ${fmt(r.start)} – ${fmt(r.end)}, ${Number(r.progress)||0}%"><i style="width:${Number(r.progress)||0}%"></i></div>` : ""}
        ${rev ? `<span class="base" style="left:${BL}%;width:${Math.min(BW,100-BL)}%" title="Original: ${fmt(r.baseStart)} – ${fmt(r.baseEnd)}"></span>` : ""}
        ${showToday ? `<span class="today-line" style="left:${tx}%"></span>` : ""}</div>`;
    }).join("")}
  </div></div></div>`;
}

function rateClass(r){ return r >= 100 ? "ok" : r >= 75 ? "" : r >= 50 ? "warn" : "bad"; }

/* ----- Reports -----
 * A report is built once as data (sections of typed columns and rows), then rendered three ways:
 * as a printable document, as an Excel workbook (one sheet per section) and as CSV.
 */
const REPORTS = {
  accomplishment: {title:"Accomplishment Report", blurb:"Physical and financial accomplishment against targets, with highlights and timeline adjustments."},
  budget:         {title:"Budget Utilization Report", blurb:"Approved budget against utilization, by category, expense class and project, with the expense ledger."},
  status:         {title:"Project Status Summary", blurb:"One line per project: schedule, progress, accomplishment rate and budget at a glance."}
};
function periodRange(){
  const R = state.rep, y = Number(R.year);
  if (R.period === "custom") {
    const f = R.from || (y+"-01-01"), t = R.to || (y+"-12-31");
    return f <= t ? [f, t, fmt(f) + " to " + fmt(t)] : [t, f, fmt(t) + " to " + fmt(f)];
  }
  if (R.period === "annual") return [y+"-01-01", y+"-12-31", "Calendar Year " + y];
  if (R.period === "H1") return [y+"-01-01", y+"-06-30", "First Semester (January–June) " + y];
  if (R.period === "H2") return [y+"-07-01", y+"-12-31", "Second Semester (July–December) " + y];
  const q = QUARTERS.find(x => x[0] === R.period);
  const names = {Q1:"First Quarter", Q2:"Second Quarter", Q3:"Third Quarter", Q4:"Fourth Quarter"};
  return [y+"-"+q[1], y+"-"+q[2], names[q[0]] + " " + y];
}
/* Quarter cells of a target that fall inside the period. */
function quarterIdx(year, from, to){
  return QUARTERS.map((q,i) => [i, year+"-"+q[1], year+"-"+q[2]]).filter(([,f,t]) => f <= to && t >= from).map(([i]) => i);
}
function reportProjects(){
  const R = state.rep, [from, to] = periodRange();
  return state.projects
    .filter(p => R.scope === "all" || involved(p))
    .filter(p => R.cat === "all" || (catOf(p.category) ? p.category : "none") === R.cat)
    .filter(p => R.unit === "all" || (p.unit || "") === R.unit)
    .filter(p => R.project === "all" || p.id === R.project)
    .filter(p => (!p.start || p.start <= to) && (!p.end || p.end >= from))
    .sort((a,b) => (CATS.findIndex(c=>c.k===a.category)+10)%10 - (CATS.findIndex(c=>c.k===b.category)+10)%10 || a.title.localeCompare(b.title));
}
function projFacts(p, from, to){
  const tRows = targetsOf(p.id).map(t => {
    const qi = quarterIdx(Number(t.year), from, to);
    if (!qi.length) return null;
    const T = qi.reduce((s,i)=>s+num((t.q||[])[i]),0), A = qi.reduce((s,i)=>s+num((t.a||[])[i]),0);
    return {indicator:t.indicator, unit:t.unit||"", T, A, rate: T ? A/T*100 : null};
  }).filter(Boolean);
  const rated = tRows.filter(r => r.rate != null);
  const rate = rated.length ? rated.reduce((s,r)=>s+Math.min(r.rate,100),0)/rated.length : null;
  return {p, tRows, rate, b: budgetOf(p.id, from, to), progress: projProgress(p), health: projStatus(p),
    updates: accsOf(p.id).filter(a => a.date >= from && a.date <= to).reverse(),
    openQueries: threadsOf(p.id).filter(t => !t.closed).length,
    lastUpdate: (accsOf(p.id)[0] || {}).date || ""};
}
const catLabel = k => (catOf(k) || {label:"Uncategorized"}).label;
const catKeys = () => [...CATS.map(c => c.k), "none"];
const groupOf = p => catOf(p.category) ? p.category : "none";

function buildReport(){
  const R = state.rep, [from, to, periodLabel] = periodRange();

  return [

    {role:"Reviewed by", name: o.reviewedName ?? (s.reviewedName || ""), pos: o.reviewedPos ?? (s.reviewedPos || "")},
    {role:"Approved by", name: o.approvedName ?? (s.approvedName || ""), pos: o.approvedPos ?? (s.approvedPos || "")}
  ];
}

/* ----- value formatting shared by the document and CSV ----- */
function cellText(v, type){
  if (v == null || v === "") return type === "text" || type === "longtext" ? "" : "—";
  if (type === "money") return peso(v);
  if (type === "pct") return (Math.round(v*10)/10).toFixed(1) + "%";
  if (type === "int") return String(Math.round(v));
  if (type === "num") return (Math.round(v*100)/100).toLocaleString("en-PH");
  if (type === "date") return /^\d{4}-\d{2}-\d{2}$/.test(v) ? fmt(v) : String(v);
  return String(v);
}

function reportDocHtml(rep){
  const sig = signatories(), st = reportSettings();
  const header = state.rep.sig?.header ?? (st.header || "");
  const by = (myDoc() || {}).fullName || state.me.name || "";
  const table = s => {
    const head = `<thead><tr>${s.cols.map(c => `<th class="${["money","pct","int","num"].includes(c.type)?"num":""}">${esc(c.h)}</th>`).join("")}</tr></thead>`;
    const row = r => `<tr>${r.map((v,i) => { const t = s.cols[i].type; return `<td class="${["money","pct","int","num"].includes(t)?"num":""}${t==="longtext"?" long":""}">${esc(cellText(v,t))}</td>`; }).join("")}</tr>`;
    let body = "";
    if (s.groups) body = s.groups.map(g => `<tr><td class="grp" colspan="${s.cols.length}">${esc(g.label)}</td></tr>` + g.rows.map(row).join("")).join("");
    else body = (s.rows||[]).map(row).join("");
    const isEmpty = s.groups ? !s.groups.some(g => g.rows.length) : !(s.rows||[]).length;
    if (isEmpty) return `<p class="doc-empty">${esc(s.empty || "Nothing to report for this period.")}</p>`;
    const foot = s.total ? `<tfoot><tr>${s.total.map((v,i) => `<td class="${["money","pct","int","num"].includes(s.cols[i].type)?"num":""}">${esc(cellText(v, s.cols[i].type))}</td>`).join("")}</tr></tfoot>` : "";
    const totalW = s.cols.reduce((a,c) => a + (c.w || 14), 0);
    const colgroup = `<colgroup>${s.cols.map(c => `<col style="width:${((c.w || 14) / totalW * 100).toFixed(2)}%">`).join("")}</colgroup>`;
    return `<div class="doc-tablewrap"><table class="doc-table">${colgroup}${head}<tbody>${body}</tbody>${foot}</table></div>`;
  };
  return `<article class="doc" id="reportDoc">
    <header class="doc-head">
      ${logoHtml()}
      <div class="doc-org"><div class="doc-rep">Republic of the Philippines</div><div class="doc-uni">TECHNOLOGICAL UNIVERSITY OF THE PHILIPPINES</div>${header ? `<div class="doc-addr">${esc(header)}</div>` : ""}</div>
    </header>

    ${rep.count ? rep.sections.map(s => `<section class="doc-sec"><h2>${esc(s.heading)}</h2>${table(s)}${s.note ? `<p class="doc-note">${esc(s.note)}</p>` : ""}</section>`).join("")
      : `<p class="doc-empty">No projects match these settings. Projects are included when their dates overlap the period. Choose another period or widen the filters.</p>`}
    <div class="doc-sigs">${sig.map(s => `<div class="doc-sig"><div class="doc-sigrole">${esc(s.role)}:</div><div class="doc-signame">${esc(s.name) || "&nbsp;"}</div><div class="doc-sigpos">${esc(s.pos) || "&nbsp;"}</div></div>`).join("")}</div>
    <footer class="doc-foot">Generated ${esc(fmtTs(Date.now()))}${by ? " by " + esc(by) : ""} · University Activity Tracker</footer>
  </article>`;
}

/* ----- downloads ----- */
function saveBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
const reportFileName = (rep, ext) => (rep.title + " – " + rep.periodLabel).replace(/[\\/:*?"<>|]+/g, "-") + "." + ext;

function downloadCsv(){
  const rep = buildReport();
  const lines = [[rep.title], [rep.periodLabel + " (" + rep.from + " to " + rep.to + ")"], ...rep.filters.map(f => [f]), []];
  const raw = (v, t) => v == null ? "" : (t === "money" ? Number(v).toFixed(2) : t === "pct" ? (Math.round(v*10)/10).toFixed(1) : v);
  rep.sections.forEach(s => {
    lines.push([s.heading]);
    lines.push(s.cols.map(c => c.h + (c.type === "money" ? " (PHP)" : c.type === "pct" ? " (%)" : "")));
    const emit = r => lines.push(r.map((v,i) => raw(v, s.cols[i].type)));
    if (s.groups) s.groups.forEach(g => { if (g.rows.length) { lines.push([g.label]); g.rows.forEach(emit); } });
    else (s.rows||[]).forEach(emit);
    if (s.total) emit(s.total);
    lines.push([]);
  });
  signatories().forEach(s => lines.push([s.role, s.name, s.pos]));
  const csv = "﻿" + lines.map(r => r.map(v => { const x = String(v ?? ""); return /[",\n\r]/.test(x) ? '"' + x.replace(/"/g,'""') + '"' : x; }).join(",")).join("\r\n");
  saveBlob(new Blob([csv], {type:"text/csv;charset=utf-8"}), reportFileName(rep, "csv"));
  toast("CSV downloaded");
}

function downloadXlsx(){
  const rep = buildReport();
  const sig = signatories(), header = state.rep.sig?.header ?? (reportSettings().header || "");
  const sheets = rep.sections.map(s => {
    const n = s.cols.length, rows = [], merges = [];
    const title = (txt, style) => { rows.push([{v:txt, s:style}]); if (n > 1) merges.push([rows.length-1, 0, rows.length-1, n-1]); };
    title("TECHNOLOGICAL UNIVERSITY OF THE PHILIPPINES", 4);
    if (header) title(header, 11);
    title(rep.title, 4);
    title(rep.periodLabel + " (" + fmt(rep.from) + " to " + fmt(rep.to) + ")" + (rep.filters.length ? " · " + rep.filters.join(" · ") : ""), 11);
    rows.push([]);
    title(s.heading, 12);
    const headerRow = rows.length;
    rows.push(s.cols.map(c => ({v:c.h, s:1})));
    const styleOf = (t, total) => total ? ({money:5, pct:10, int:13, num:13}[t] || 9) : ({money:2, pct:3, int:6, num:14, longtext:8}[t] || 8);
    const val = (v, t) => v == null || v === "" ? null : t === "pct" ? v/100 : (["money","int","num"].includes(t) ? Number(v) : t === "date" && /^\d{4}-\d{2}-\d{2}$/.test(v) ? fmt(v) : String(v));
    const emit = (r, total) => rows.push(r.map((v,i) => ({v: val(v, s.cols[i].type), s: styleOf(s.cols[i].type, total)})));
    const isEmpty = s.groups ? !s.groups.some(g => g.rows.length) : !(s.rows||[]).length;
    if (isEmpty) rows.push([{v: s.empty || "Nothing to report for this period.", s:11}]);
    else if (s.groups) s.groups.forEach(g => { if (!g.rows.length) return; rows.push([{v:g.label, s:7}, ...Array(n-1).fill({v:null, s:7})]); merges.push([rows.length-1, 0, rows.length-1, n-1]); g.rows.forEach(r => emit(r)); });
    else (s.rows||[]).forEach(r => emit(r));
    if (s.total && !isEmpty) emit(s.total, true);
    if (s.note) { rows.push([]); title(s.note, 11); }
    rows.push([]); rows.push([]);
    rows.push(sig.map(x => ({v: x.role + ":", s:11})));
    rows.push([]);
    rows.push(sig.map(x => ({v: x.name, s:12})));
    rows.push(sig.map(x => ({v: x.pos, s:11})));
    return {name: s.sheet, rows, merges, widths: s.cols.map(c => c.w || 14), freeze: headerRow + 1};
  });
  saveBlob(new Blob([makeXlsx(sheets)], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}), reportFileName(rep, "xlsx"));
  toast("Excel file downloaded");
}

function crc32(b){ let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC_TABLE[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zipStore(files){
  const enc = new TextEncoder(), parts = [], central = [];
  let offset = 0;
  const d = new Date(), dosTime = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1), dosDate = ((d.getFullYear() - 1980) << 9) | ((d.getMonth()+1) << 5) | d.getDate();
  for (const [name, text] of files) {
    const nb = enc.encode(name), data = enc.encode(text), crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, nb.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), nb, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, dosTime, true); ch.setUint16(14, dosDate, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, nb.length, true);
    ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), nb);
    offset += 30 + nb.length + data.length;
  }
  const cdSize = central.reduce((s,p) => s + p.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)]);
}

function renderAdmin(){
  const P = state.projects;
  const catStats = CATS.map(c => {
    const list = P.filter(p => p.category === c.k);
    const alloc = list.reduce((s,p)=>s+budgetOf(p.id).alloc,0), spent = list.reduce((s,p)=>s+budgetOf(p.id).spentAll,0);
    return {c, n:list.length, avg: list.length ? Math.round(list.reduce((s,p)=>s+projProgress(p),0)/list.length) : 0,
      risk: list.filter(p => ["late","behind"].includes(projStatus(p))).length, alloc, spent};
  });

        <td class="num" style="${s.risk ? "color:var(--bad);font-weight:700" : ""}">${s.risk}</td>

        <td><div class="catbar"><span class="meter ${u>100?"bad":u>90?"warn":""}"><i style="width:${clamp(u,0,100)}%"></i></span><span class="mono">${s.alloc ? pct(u) : "—"}</span></div></td></tr>`; }).join("")}</tbody>
      <tfoot><tr><td>All categories</td><td class="num">${catStats.reduce((a,s)=>a+s.n,0)}</td><td></td><td class="num">${catStats.reduce((a,s)=>a+s.risk,0)}</td><td class="num">${peso(catStats.reduce((a,s)=>a+s.alloc,0))}</td><td class="num">${peso(catStats.reduce((a,s)=>a+s.spent,0))}</td><td></td></tr></tfoot>
    </table></div>
    ${uncats.length ? `<div class="notice" style="border:1px solid var(--line);border-radius:var(--r)"><span><b>${uncats.length} project${uncats.length===1?"":"s"} without a category.</b> Open each and use Edit to assign one of the five categories so it appears in reports.</span><button class="btn sm" data-act="show-uncat">Show them</button></div>` : ""}

    </div>
    <section class="block"><div class="bhead"><h3>Registered users</h3><span class="count">${members.length}</span></div>
      ${members.length ? `<div class="table-wrap"><table>

          <td>${m.role==="admin"?`<span class="tagline">Administrator</span>`:`<span class="asub">Project owner</span>`}</td>

      : `<div class="empty">No one else has registered yet. Give faculty and staff this tracker's address so they can register. You can make any of them an administrator from this table.</div>`}
    </section>
    <section class="block"><div class="bhead"><h3>Announcements</h3><span class="count">${state.announcements.length}</span></div>
      ${state.announcements.length ? `<ul class="log">${state.announcements.map(a => `<li><div class="d mono">${esc(fmtTs(a.createdAt))}</div><div class="t" data-text="${esc(a.text)}"></div><div class="row-actions"><button class="btn ghost danger" data-act="delete-ann" data-id="${a.id}">Delete</button></div></li>`).join("")}</ul>`
      : `<div class="empty">Post deadlines and reminders for all users, such as “Q4 accomplishment reports are due December 15.” The latest one shows as a banner for every user.</div>`}
    </section>`;
  $("#adminInner").querySelectorAll("[data-text]").forEach(n => { n.textContent = n.dataset.text; });

/* ---------- modals ---------- */
function modal(title, body, onSubmit, submitLabel){
  const root = $("#modalRoot");
  root.innerHTML = `<div class="overlay" data-act="close-overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <header><h3 id="mTitle">${title}</h3></header>
    <form id="mForm" novalidate>${body}<div class="err" id="mErr" hidden></div>
    <div class="form-actions"><button type="button" class="btn" data-act="close">Cancel</button><button type="submit" class="btn primary" id="mSubmit">${submitLabel||"Save"}</button></div></form>
  </div></div>`;
  const form = $("#mForm");
  form.addEventListener("submit", async ev => {
    ev.preventDefault();
    const fd = {};
    new FormData(form).forEach((v,k) => { fd[k] = v; });
    form.querySelectorAll("input[type=checkbox]").forEach(c => { fd[c.name] = c.checked; });
    const err = onSubmit.validate ? onSubmit.validate(fd) : null;
    if (err) { $("#mErr").textContent = err; $("#mErr").hidden = false; return; }
    $("#mSubmit").disabled = true;
    const ok = await onSubmit(fd);
    if (ok !== false) closeModal(); else $("#mSubmit").disabled = false;
  });
  const firstInput = form.querySelector("input:not([type=hidden]),select,textarea"); if (firstInput) firstInput.focus();
}
function closeModal(){ $("#modalRoot").innerHTML = ""; }
const dateErr = (s,e) => !s || !e ? "Enter both a start date and an end date." : (e < s ? "The end date can't be before the start date." : null);
const curProject = () => state.projects.find(x => x.id === state.selected);
const memberOptions = (sel, exclude=[]) => state.members.filter(m => m.active !== false && !exclude.includes(m.id)).sort((a,b)=>(a.fullName||"").localeCompare(b.fullName||"")).map(m => `<option value="${m.id}" ${sel===m.id?"selected":""}>${esc(m.fullName)}${m.office?" — "+esc(m.office):""}</option>`).join("");

function openProject(p){
  p = p || {};
  const isNew = !p.id;
  const fn = async fd => {
    const data = {title:fd.title.trim(), category:fd.category, unit:fd.unit.trim(), fundSource:fd.fundSource.trim(), start:fd.start, end:fd.end, description:fd.description.trim(), status:fd.status};
    if (state.isAdmin && fd.leaderId !== undefined) {
      data.leaderId = fd.leaderId || null;
      if (data.leaderId) data.memberIds = (p.memberIds||[]).filter(x => x !== data.leaderId);
    }
    if (!isNew) {
      if (p.start !== data.start || p.end !== data.end) { if (!p.baseStart) { data.baseStart = p.start; data.baseEnd = p.end; } }
      return write(() => upd("projects", p.id, data), "Project updated");
    }
    Object.assign(data, {createdAt:Date.now(), createdBy:state.me.id, baseStart:data.start, baseEnd:data.end, memberIds:[]});
    if (!state.isAdmin || !data.leaderId) data.leaderId = data.leaderId || (myDoc() ? state.me.id : null);
    const amt = Math.round(num(fd.approvedBudget) * 100) / 100;
    if (amt > 0) Object.assign(data, {approvedBudget: amt, budgetRef: (fd.budgetRef||"").trim(), budgetDate: fd.budgetDate || ""});
    let newId;
    const ok = await write(async () => { newId = await add("projects", data); }, "Project created");
    if (ok && amt > 0) await write(() => add("revisions", {projectId:newId, kind:"budget", oldAmount:0, newAmount:amt, ref:data.budgetRef, reason:""}));
    if (ok) { state.selected = newId; state.tab = amt > 0 ? "budget" : "overview"; render(); }
    return ok;
  };
  fn.validate = fd => !fd.title.trim() ? "Give the project a title." : (!fd.category ? "Choose a category." : (fd.approvedBudget && !(Number(fd.approvedBudget) >= 0) ? "Enter the approved budget as an amount in pesos." : dateErr(fd.start, fd.end)));
  const leaderField = state.isAdmin ? `<div class="field"><label for="f-leader">Project leader</label><select id="f-leader" name="leaderId"><option value="">${isNew && myDoc() ? "Me" : "Not assigned"}</option>${memberOptions(p.leaderId)}</select>${p.lead && !p.leaderId ? `<span class="hint">Previously recorded as “${esc(p.lead)}”.</span>` : ""}</div>` : "";
  modal(isNew ? "New project" : "Edit project", `
    <div class="field"><label for="f-title">Project title</label><input id="f-title" name="title" value="${esc(p.title)}" placeholder="e.g. Faculty Research Colloquium 2026"></div>
    <div class="row2">
      <div class="field"><label for="f-cat">Category</label><select id="f-cat" name="category"><option value="">Choose…</option>${CATS.map(c => `<option value="${c.k}" ${p.category===c.k?"selected":""}>${c.label}</option>`).join("")}</select></div>
      <div class="field"><label for="f-status">Implementation status</label><select id="f-status" name="status">${Object.entries(PSTAT).map(([k,l]) => `<option value="${k}" ${(p.status||"planning")===k?"selected":""}>${l}</option>`).join("")}</select></div>
    </div>
    <div class="row2">
      <div class="field"><label for="f-unit">College / office</label><input id="f-unit" name="unit" value="${esc(p.unit ?? (isNew && myDoc() ? myDoc().office : ""))}" placeholder="e.g. College of Engineering"></div>
      <div class="field"><label for="f-fund">Fund source</label><input id="f-fund" name="fundSource" value="${esc(p.fundSource)}" placeholder="e.g. GAA 2026, IGF, external grant"></div>
    </div>
    ${leaderField}
    <div class="row2">
      <div class="field"><label for="f-start">Start date</label><input id="f-start" type="date" name="start" value="${esc(p.start||TODAY)}"></div>
      <div class="field"><label for="f-end">End date</label><input id="f-end" type="date" name="end" value="${esc(p.end)}"></div>
    </div>
    ${!isNew ? `<div class="hint">To move dates because of delays, use “Revise project dates” on the Overview tab so the reason is logged. The approved budget is changed on the Budget tab.</div>` : `
    <div class="row3">
      <div class="field"><label for="f-pbud">Approved budget (₱)</label><input id="f-pbud" class="mono" type="number" min="0" step="0.01" name="approvedBudget" placeholder="0.00"></div>
      <div class="field"><label for="f-pref">Approval reference</label><input id="f-pref" name="budgetRef" placeholder="e.g. BOR Res. No. 45"></div>
      <div class="field"><label for="f-pdate">Date approved</label><input id="f-pdate" type="date" name="budgetDate"></div>
    </div>`}
    <div class="field"><label for="f-desc">Objectives / description</label><textarea id="f-desc" name="description" placeholder="What this project should achieve">${esc(p.description)}</textarea></div>`, fn, isNew ? "Create project" : "Save");
}

function openActivity(a, catchUp){
  const p = curProject(); if (!p) return;
  a = a || {};
  const isNew = !a.id;
  const fn = async fd => {
    const data = {name:fd.name.trim(), assignee:fd.assignee.trim(), start:fd.start, end:fd.end, progress:Number(fd.progress)||0};
    if (!isNew) return write(() => upd("activities", a.id, data), "Sub-activity updated");
    Object.assign(data, {projectId:p.id, createdAt:Date.now(), baseStart:fd.start, baseEnd:fd.end, catchUp:!!catchUp});
    let id;
    const ok = await write(async () => { id = await add("activities", data); }, catchUp ? "Catch-up activity added" : "Sub-activity added");
    if (ok && catchUp) await write(() => add("revisions", {projectId:p.id, activityId:id, kind:"catchup", newStart:fd.start, newEnd:fd.end, reason:fd.reason.trim(), by:state.me.id, at:Date.now()}));
    return ok;
  };
  fn.validate = fd => !fd.name.trim() ? "Name the activity." : (catchUp && !fd.reason.trim() ? "Explain what this catch-up activity recovers." : dateErr(fd.start, fd.end));
  const pr = Number(a.progress)||0;
  modal(catchUp ? "Add catch-up activity" : isNew ? "Add sub-activity" : "Edit sub-activity", `
    ${catchUp ? `<div class="hint">A catch-up activity recovers work that fell behind. It's marked on the schedule and logged under Timeline changes.</div>` : ""}
    <div class="field"><label for="f-name">${catchUp ? "Catch-up activity" : "Sub-activity"}</label><input id="f-name" name="name" value="${esc(a.name)}" placeholder="${catchUp ? "e.g. Saturday make-up training sessions" : "e.g. Secure venue and equipment"}"></div>
    <div class="field"><label for="f-assignee">Assigned to</label><input id="f-assignee" name="assignee" value="${esc(a.assignee)}" placeholder="Person or team"></div>
    <div class="row2">
      <div class="field"><label for="f-astart">Start date</label><input id="f-astart" type="date" name="start" value="${esc(a.start||(catchUp?TODAY:p.start))}"></div>
      <div class="field"><label for="f-aend">End date</label><input id="f-aend" type="date" name="end" value="${esc(a.end||p.end)}"></div>
    </div>
    ${catchUp ? `<div class="field"><label for="f-reason">Reason / what it recovers</label><textarea id="f-reason" name="reason" placeholder="e.g. Recovers 3 sessions lost to typhoon class suspensions in August"></textarea></div>` : `<input type="hidden" name="reason" value="">`}
    <div class="field"><label for="f-prog">Progress: <span class="mono" id="progOut">${pr}%</span></label>
      <input id="f-prog" type="range" name="progress" min="0" max="100" step="5" value="${pr}" oninput="document.getElementById('progOut').textContent=this.value+'%'"></div>
    ${!isNew ? `<div class="hint">To change dates after a delay, use “Revise dates” so the change and its reason are logged.</div>` : `<div class="hint">Project dates: ${fmt(p.start)} – ${fmt(p.end)}</div>`}`, fn);
  if (!isNew) { ["f-astart","f-aend"].forEach(id => { const el = document.getElementById(id); if (el) el.readOnly = true; }); }
}

function openProgress(a){

function openRevise(a){
  const p = curProject(); if (!p) return;
  const target = a || p;
  const fn = async fd => {
    const patch = {start:fd.start, end:fd.end};
    if (!target.baseStart) { patch.baseStart = target.start; patch.baseEnd = target.end; }
    const ok = await write(() => upd(a ? "activities" : "projects", target.id, patch), "Dates revised");
    if (ok) await write(() => add("revisions", {projectId:p.id, activityId:a ? a.id : null, kind:"revise", oldStart:target.start||"", oldEnd:target.end||"", newStart:fd.start, newEnd:fd.end, reason:fd.reason.trim(), by:state.me.id, at:Date.now()}));
    return ok;
  };
  fn.validate = fd => dateErr(fd.start, fd.end) || (fd.start === target.start && fd.end === target.end ? "Change at least one date." : (!fd.reason.trim() ? "Give the reason for the change; the admin sees it." : null));
  modal(a ? "Revise sub-activity dates" : "Revise project dates", `
    <div class="aname">${esc(a ? a.name : p.title)}</div>
    <div class="hint">Current: ${fmt(target.start)} – ${fmt(target.end)}${target.baseStart && (target.baseStart!==target.start||target.baseEnd!==target.end) ? ` · Original: ${fmt(target.baseStart)} – ${fmt(target.baseEnd)}` : ""}</div>
    <div class="row2">
      <div class="field"><label for="f-rs">New start date</label><input id="f-rs" type="date" name="start" value="${esc(target.start)}"></div>
      <div class="field"><label for="f-re">New end date</label><input id="f-re" type="date" name="end" value="${esc(target.end)}"></div>
    </div>
    <div class="field"><label for="f-rr">Reason for the change</label><textarea id="f-rr" name="reason" placeholder="e.g. Venue unavailable during midterm examinations; moved two weeks later"></textarea></div>
    <div class="hint">The original dates stay on the schedule as a dashed line, and this change is logged for the administrator.</div>`, fn, "Revise dates");
}

function openAcc(c){
  const p = curProject(); if (!p) return;
  c = c || {};
  const acts = actsOf(p.id);
  const fn = async fd => {
    const data = {date:fd.date, text:fd.text.trim(), activityId:fd.activityId || null,
      progress: fd.activityId && fd.progress !== "" ? clamp(Number(fd.progress),0,100) : null, projectStatus: fd.projectStatus || null};
    const ok = await write(() => c.id ? upd("accomplishments", c.id, data) : add("accomplishments", {...data, projectId:p.id, by:state.me.id, createdAt:Date.now()}), c.id ? "Update edited" : "Update posted");
    if (ok && data.activityId && data.progress != null) await write(() => upd("activities", data.activityId, {progress:data.progress}));
    if (ok && data.projectStatus && data.projectStatus !== p.status) await write(() => upd("projects", p.id, {status:data.projectStatus}));
    return ok;
  };
  fn.validate = fd => !fd.date ? "Enter the date." : (!fd.text.trim() ? "Describe what was accomplished." : (fd.progress !== "" && (isNaN(Number(fd.progress)) || fd.progress < 0 || fd.progress > 100) ? "Progress must be between 0 and 100." : null));
  modal(c.id ? "Edit status update" : "Post status update", `
    <div class="row2">
      <div class="field"><label for="f-cdate">Date</label><input id="f-cdate" type="date" name="date" value="${esc(c.date||TODAY)}"></div>
      <div class="field"><label for="f-cact">Sub-activity</label><select id="f-cact" name="activityId">
        <option value="">Whole project</option>
        ${acts.map(a => `<option value="${a.id}" ${c.activityId===a.id?"selected":""}>${esc(a.name)}</option>`).join("")}
      </select></div>
    </div>
    <div class="field"><label for="f-ctext">What was accomplished</label><textarea id="f-ctext" name="text" placeholder="e.g. Signed MOA with the venue; 120 participants registered">${esc(c.text)}</textarea></div>
    <div class="row2">
      <div class="field"><label for="f-cprog">Set sub-activity progress to (%)</label><input id="f-cprog" class="mono" type="number" name="progress" min="0" max="100" step="5" value="${c.progress ?? ""}" placeholder="Leave blank to keep"></div>
      <div class="field"><label for="f-cps">Project status</label><select id="f-cps" name="projectStatus"><option value="">Keep “${esc(PSTAT[p.status]||"Planning")}”</option>${Object.entries(PSTAT).map(([k,l]) => `<option value="${k}" ${c.projectStatus===k?"selected":""}>${l}</option>`).join("")}</select></div>
    </div>`, fn, c.id ? "Save" : "Post update");
}

function openTarget(t){

function openActuals(t){
