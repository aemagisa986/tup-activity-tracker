function openLine(l){
  const p = curProject(); if (!p) return;
  l = l || {};
  const b = budgetOf(p.id);
  const fn = fd => { const data = {cls:fd.cls, item:fd.item.trim(), allocated:num(fd.allocated)};
    return l.id ? write(() => upd("budgetLines", l.id, data), "Line item updated") : write(() => add("budgetLines", {...data, projectId:p.id, createdAt:Date.now()}), "Line item added"); };
  fn.validate = fd => !fd.item.trim() ? "Describe the item." : (fd.allocated === "" || !(Number(fd.allocated) >= 0) ? "Enter the approved amount for this item." : null);
  const left = b.approved ? b.approved - b.lineTotal + num(l.allocated) : null;
  modal(l.id ? "Edit line item" : "Add line item", `
    <div class="field"><label for="f-cls">Expense class</label><select id="f-cls" name="cls">${Object.entries(ECLASS).map(([k,v]) => `<option value="${k}" ${(l.cls||"MOOE")===k?"selected":""}>${k} — ${v}</option>`).join("")}</select></div>
    <div class="field"><label for="f-item">Item / particulars</label><input id="f-item" name="item" value="${esc(l.item)}" placeholder="e.g. Meals and snacks for participants"></div>
    <div class="field"><label for="f-alloc">Approved amount (₱)</label><input id="f-alloc" class="mono" type="number" min="0" step="0.01" name="allocated" value="${l.allocated ?? ""}">
      <span class="hint">${left != null ? (left >= 0 ? peso(left) + " of the approved budget is not yet assigned to other line items." : "Other line items already exceed the approved budget by " + peso(-left) + ".") : "Record the project's approved budget first so line items can be checked against it."}</span></div>`, fn);
}
function lineBalance(lineId, exceptExpenseId){
  const l = state.budgetLines.find(x => x.id === lineId); if (!l) return null;
  return num(l.allocated) - state.expenses.filter(e => e.lineId === lineId && e.id !== exceptExpenseId).reduce((s,e)=>s+num(e.amount),0);
}
function openExpense(e){
  const p = curProject(); if (!p) return;
  e = e || {};
  const lines = linesOf(p.id);
  const fn = fd => { const data = {date:fd.date, lineId:fd.lineId, particulars:fd.particulars.trim(), ref:fd.ref.trim(), amount:num(fd.amount)};
    return e.id ? write(() => upd("expenses", e.id, data), "Expense updated") : write(() => add("expenses", {...data, projectId:p.id, by:state.me.id, createdAt:Date.now()}), "Expense recorded"); };
  fn.validate = fd => {
    if (!fd.date) return "Enter the date.";
    if (!fd.particulars.trim()) return "Describe the expense.";
    if (!(Number(fd.amount) > 0)) return "Enter an amount above zero.";
    const bal = lineBalance(fd.lineId, e.id);
    if (bal != null && Number(fd.amount) > bal + 0.004) return `This is ${peso(Number(fd.amount) - bal)} more than the line item's remaining balance (${peso(Math.max(bal,0))}). Check the amount, or ask the project leader to update the line item to the approved realignment first.`;
    return null;
  };
  modal(e.id ? "Edit expense" : "Record expense", `
    <div class="row2">
      <div class="field"><label for="f-edate">Date</label><input id="f-edate" type="date" name="date" value="${esc(e.date||TODAY)}"></div>
      <div class="field"><label for="f-eline">Line item (remaining balance)</label><select id="f-eline" name="lineId">${lines.map(l => `<option value="${l.id}" ${e.lineId===l.id?"selected":""}>${esc(l.cls)} · ${esc(l.item)} (${peso(lineBalance(l.id, e.id))})</option>`).join("")}</select></div>
    </div>
    <div class="field"><label for="f-epart">Particulars</label><input id="f-epart" name="particulars" value="${esc(e.particulars)}" placeholder="e.g. Snacks for Day 1, 120 pax"></div>
    <div class="row2">
      <div class="field"><label for="f-eamt">Amount (₱)</label><input id="f-eamt" class="mono" type="number" min="0" step="0.01" name="amount" value="${e.amount ?? ""}"></div>
      <div class="field"><label for="f-eref">Reference no.</label><input id="f-eref" class="mono" name="ref" value="${esc(e.ref)}" placeholder="DV / PR / OR number"></div>
    </div>`, fn);
}
/* The approved budget comes from an approving document; changes to it are logged with a reason. */
function openBudget(){
  const p = curProject(); if (!p) return;
  const old = num(p.approvedBudget);
  const fn = async fd => {
    const amt = Math.round(num(fd.amount) * 100) / 100;
    const ok = await write(() => upd("projects", p.id, {approvedBudget: amt, budgetRef: fd.ref.trim(), budgetDate: fd.date || "", fundSource: fd.fund.trim()}), old ? "Approved budget updated" : "Approved budget recorded");
    if (ok && amt !== old) await write(() => add("revisions", {projectId:p.id, kind:"budget", oldAmount: old, newAmount: amt, ref: fd.ref.trim(), reason: (fd.reason||"").trim()}));
    return ok;
  };
  fn.validate = fd => !(Number(fd.amount) > 0) ? "Enter the approved budget, in pesos." : (old && Math.abs(Number(fd.amount) - old) > 0.004 && !(fd.reason||"").trim() ? "Give the reason for changing the approved budget (for example: augmentation approved under Board Resolution No. 52)." : null);
  modal(old ? "Change approved budget" : "Record approved budget", `
    <div class="aname">${esc(p.title)}</div>
    <div class="row2">
      <div class="field"><label for="f-bamt">Approved budget (₱)</label><input id="f-bamt" class="mono" type="number" min="0" step="0.01" name="amount" value="${old || ""}"></div>
      <div class="field"><label for="f-bdate">Date approved</label><input id="f-bdate" type="date" name="date" value="${esc(p.budgetDate || "")}"></div>
    </div>
    <div class="row2">
      <div class="field"><label for="f-bref">Approval reference</label><input id="f-bref" name="ref" value="${esc(p.budgetRef || "")}" placeholder="e.g. BOR Res. No. 45, s. ${THIS_YEAR}"></div>
      <div class="field"><label for="f-bfund">Fund source</label><input id="f-bfund" name="fund" value="${esc(p.fundSource || "")}" placeholder="e.g. GAA ${THIS_YEAR}, IGF, external grant"></div>
    </div>
    ${old ? `<div class="field"><label for="f-breason">Reason for the change</label><textarea id="f-breason" name="reason" placeholder="Needed only if the amount changes, e.g. augmentation, realignment or reduction, and the document that approved it"></textarea></div>` : `<input type="hidden" name="reason" value="">`}
    <div class="hint">Then break it down into line items by expense class. Expenses are recorded against those line items.</div>`, fn, old ? "Save" : "Record");
}

function openThread(kind, projectId){
  const p = state.projects.find(x => x.id === (projectId || state.selected)); if (!p) return;
  const labels = {query:"Send a query", message:"Send a message", concern:"Ask the administrator"};
  const fn = async fd => {
    const at = Date.now();
    const awaiting = kind === "query" ? "user" : kind === "concern" ? "admin" : null;
    let tid;
    const ok = await write(async () => { tid = await add("threads", {projectId:p.id, subject:fd.subject.trim(), kind, createdBy:state.me.id, byAdmin:state.isAdmin, createdAt:at, lastAt:at, awaiting, closed:false}); }, kind === "query" ? "Query sent" : "Message sent");
    if (ok) { await write(() => add("posts", {threadId:tid, projectId:p.id, from:state.me.id, asAdmin:state.isAdmin, text:fd.text.trim(), at})); state.openThread = tid; render(); }
    return ok;
  };
  fn.validate = fd => !fd.subject.trim() ? "Add a subject." : (!fd.text.trim() ? "Write the message." : null);
  const ph = {query:"e.g. Explain the 40% shortfall in Q3 trainees", message:"e.g. Reminder: submit Q4 photos and attendance", concern:"e.g. Request for budget realignment"}[kind];
  modal(labels[kind], `<div class="hint">${esc(p.title)}${kind==="query" ? " · The project team sees this flagged until they reply." : ""}</div>
    <div class="field"><label for="f-subj">Subject</label><input id="f-subj" name="subject" placeholder="${ph}"></div>
    <div class="field"><label for="f-msg">Message</label><textarea id="f-msg" name="text"></textarea></div>`, fn, "Send");
}
function openReply(t){
  const fn = async fd => {
    const at = Date.now();
    const ok = await write(() => add("posts", {threadId:t.id, projectId:t.projectId, from:state.me.id, asAdmin:state.isAdmin, text:fd.text.trim(), at}), "Reply sent");
    if (ok) { await write(() => upd("threads", t.id, {lastAt:at, awaiting: state.isAdmin ? "user" : "admin"})); if (state.msgFilter === "attn") state.msgFilter = "open"; render(); }
    return ok;
  };
  fn.validate = fd => !fd.text.trim() ? "Write your reply." : null;
  modal("Reply", `<div class="aname">${esc(t.subject)}</div><div class="field"><label for="f-rep">Your reply</label><textarea id="f-rep" name="text"></textarea></div>`, fn, "Send reply");
}

function confirmBox(title, msg, label, run){
  $("#modalRoot").innerHTML = `<div class="overlay" data-act="close-overlay"><div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="mTitle">
    <header><h3 id="mTitle">${title}</h3></header>
    <form id="mForm"><p style="margin:0">${msg}</p><div class="form-actions"><button type="button" class="btn" data-act="close">Cancel</button><button type="submit" class="btn primary" id="mSubmit" style="background:var(--bad);border-color:var(--bad);color:#fff">${label||"Delete"}</button></div></form></div></div>`;
  $("#mForm").addEventListener("submit", async ev => { ev.preventDefault(); $("#mSubmit").disabled = true; await run(); closeModal(); });
  $("#mSubmit").focus();
}

/* ---------- events ---------- */
function go(view){ state.view = view; render(); window.scrollTo(0,0); }
function gotoProject(id, tab){ state.view = "projects"; state.selected = id; state.tab = tab || "overview"; const p = state.projects.find(x=>x.id===id); if (p && !involved(p)) state.scope = "all"; render(); $("#detail").scrollTop = 0; }
document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-act]"); if (!t) return;
  const act = t.dataset.act, id = t.dataset.id;
  if (act === "close-overlay" && ev.target !== t) return;
  const p = curProject();
  const find = (col) => state[col].find(x => x.id === id);
  switch (act) {
    case "nav": go(t.dataset.k); break;
    case "scope": state.scope = t.dataset.k; render(); break;
    case "new-project": openProject(); break;
    case "select": state.selected = id; state.tab = "overview"; state.openThread = null; render(); $("#detail").scrollTop = 0; break;
    case "back": state.selected = null; render(); break;
    case "filter": state.filter = t.dataset.k; render(); break;
    case "tab": state.tab = t.dataset.k; render(); break;
    case "close": case "close-overlay": closeModal(); break;
    case "edit-project": openProject(find("projects")); break;
    case "new-activity": openActivity(); break;
    case "new-catchup": openActivity(null, true); break;
    case "edit-activity": openActivity(find("activities")); break;
    case "progress": openProgress(find("activities")); break;
    case "revise": openRevise(id ? find("activities") : null); break;
    case "new-acc": openAcc(); break;
    case "edit-acc": openAcc(find("accomplishments")); break;
    case "new-target": openTarget(); break;
    case "edit-target": openTarget(find("targets")); break;
    case "actuals": openActuals(find("targets")); break;
    case "new-line": openLine(); break;
    case "edit-line": openLine(find("budgetLines")); break;
    case "new-expense": openExpense(); break;
    case "edit-expense": openExpense(find("expenses")); break;
    case "new-thread": openThread(t.dataset.k); break;
    case "quick-query": openThread("query", id); break;
    case "reply": openReply(find("threads")); break;
    case "toggle-thread": state.openThread = state.openThread === id ? null : id; render(); break;
    case "close-thread": write(() => upd("threads", id, {closed:true, awaiting:null}), "Marked resolved"); break;
    case "reopen": write(() => upd("threads", id, {closed:false, awaiting: state.isAdmin ? "user" : "admin"}), "Reopened"); break;
    case "goto-project": gotoProject(id); break;
    case "goto-thread": { const th = find("threads"); if (th) { state.openThread = th.id; gotoProject(th.projectId, "messages"); } break; }
    case "msgfilter": state.msgFilter = t.dataset.k; render(); break;
    case "period": state.rep.period = t.dataset.k; render(); break;
    case "csv": downloadCsv(); break;
    case "xlsx": downloadXlsx(); break;
    case "rtype": state.rep.type = t.dataset.k; render(); break;
    case "save-sig": saveSignatories(); break;
    case "set-budget": openBudget(); break;
    case "show-uncat": state.view = "projects"; state.scope = "all"; state.cat = "none"; state.filter = "all"; render(); break;
    case "join": {
      const pr = find("projects");
      const fn = fd => write(() => add("joinRequests", {projectId:pr.id, uid:state.me.id, note:fd.note.trim(), status:"pending", at:Date.now()}), "Request sent to the project leader");
      modal("Ask to join", `<div class="aname">${esc(pr.title)}</div><div class="hint">Led by ${esc(leaderLabel(pr))}. They'll see your request on the project's Team tab.</div>
        <div class="field"><label for="f-note">Note to the leader (optional)</label><textarea id="f-note" name="note" placeholder="e.g. I can handle the documentation and the post-activity report"></textarea></div>`, fn, "Send request");
      break; }
    case "approve": {
      const r = find("joinRequests"); if (!r || !p) break;
      const ids = [...new Set([...(p.memberIds||[]), r.uid])].filter(x => x !== p.leaderId);
      write(async () => { await upd("projects", p.id, {memberIds:ids}); await upd("joinRequests", r.id, {status:"approved", decidedAt:Date.now()}); }, "Member added");
      break; }
    case "decline": write(() => upd("joinRequests", id, {status:"declined", decidedAt:Date.now()}), "Request declined"); break;
    case "add-member": {
      if (!p) break;
      const opts = memberOptions("", [p.leaderId, ...(p.memberIds||[])]);
      if (!opts) { toast("Everyone registered is already on this project."); break; }
      const fn = fd => write(() => upd("projects", p.id, {memberIds:[...new Set([...(p.memberIds||[]), fd.uid])]}), "Member added");
      modal("Add member", `<div class="field"><label for="f-uid">Registered user</label><select id="f-uid" name="uid">${opts}</select></div><div class="hint">Members can post updates, enter actual accomplishments and record expenses.</div>`, fn, "Add");
      break; }
    case "remove-member": if (p) confirmBox("Remove member?", `${esc(nameOf(id))} will no longer be able to update this project.`, "Remove", () => write(() => upd("projects", p.id, {memberIds:(p.memberIds||[]).filter(x => x !== id)}), "Member removed")); break;
    case "leave": { const pr = find("projects"); confirmBox("Leave this project?", `You'll stop seeing “${esc(pr.title)}” under My projects and can no longer update it.`, "Leave", () => write(() => upd("projects", pr.id, {memberIds:(pr.memberIds||[]).filter(x => x !== state.me.id)}), "You left the project")); break; }
    case "toggle-member": { const m = state.members.find(x => x.id === id); if (m) write(async () => { await api("PATCH", "/api/users/"+id, {active: m.active === false}); await refresh(); }, m.active === false ? "Access restored" : "Account deactivated"); break; }
    case "toggle-role": { const m = state.members.find(x => x.id === id); if (!m) break;
      const toAdmin = m.role !== "admin";
      confirmBox(toAdmin ? "Make administrator?" : "Change to project owner?", toAdmin ? `${esc(m.fullName)} will be able to see and change every project, send queries, manage accounts and post announcements.` : `${esc(m.fullName)} will go back to managing only the projects they lead.`, toAdmin ? "Make admin" : "Make project owner",
        () => write(async () => { await api("PATCH", "/api/users/"+id, {role: toAdmin ? "admin" : "user"}); await refresh(); }, toAdmin ? "Now an administrator" : "Administrator role removed"));
      break; }
    case "reset-pw": { const m = state.members.find(x => x.id === id); if (!m) break;
      const fn = fd => write(() => api("POST", "/api/users/"+id+"/password", {password:fd.password}), "Password reset. Give the new password to " + m.fullName + ".");
      fn.validate = fd => fd.password.length < 8 ? "Use at least 8 characters." : null;
      modal("Reset password", `<div class="aname">${esc(m.fullName)}</div><div class="hint">${esc(m.email||"")} · They'll be signed out everywhere and must sign in with this new password.</div>
        <div class="field"><label for="f-npw">New temporary password</label><input id="f-npw" name="password" type="text" autocomplete="off" class="mono"></div>`, fn, "Reset password"); break; }
    case "account": { const m = myDoc() || {};
      const fn = fd => write(async () => { await api("PATCH", "/api/me", {fullName:fd.fullName, office:fd.office, position:fd.position, phone:fd.phone}); await refresh(); }, "Profile saved");
      fn.validate = fd => !fd.fullName.trim() ? "Enter your full name." : null;
      modal("Your account", `<div class="hint">${esc(state.me.email)}</div>
        <div class="field"><label for="a-name">Full name</label><input id="a-name" name="fullName" value="${esc(m.fullName)}"></div>
        <div class="field"><label for="a-off">College / office / unit</label><input id="a-off" name="office" value="${esc(m.office)}"></div>
        <div class="row2"><div class="field"><label for="a-pos">Position</label><input id="a-pos" name="position" value="${esc(m.position)}"></div><div class="field"><label for="a-ph">Contact number</label><input id="a-ph" name="phone" value="${esc(m.phone)}"></div></div>
        <div><button type="button" class="btn sm" data-act="change-pw">Change password…</button></div>`, fn); break; }
    case "change-pw": {
      const fn = fd => write(() => api("POST", "/api/me/password", {current:fd.current, next:fd.next}), "Password changed");
      fn.validate = fd => !fd.current ? "Enter your current password." : fd.next.length < 8 ? "Use a new password of at least 8 characters." : fd.next !== fd.next2 ? "The new passwords don't match." : null;
      modal("Change password", `<div class="field"><label for="p-cur">Current password</label><input id="p-cur" name="current" type="password" autocomplete="current-password"></div>
        <div class="row2"><div class="field"><label for="p-new">New password</label><input id="p-new" name="next" type="password" autocomplete="new-password"></div><div class="field"><label for="p-new2">Confirm new password</label><input id="p-new2" name="next2" type="password" autocomplete="new-password"></div></div>`, fn, "Change password"); break; }
    case "signout": signOut(); break;
    case "authtab": state.authTab = t.dataset.k; render(); break;
    case "print": window.print(); break;
    case "new-ann": { const fn = fd => write(() => add("announcements", {text:fd.text.trim()}), "Announcement posted"); fn.validate = fd => !fd.text.trim() ? "Write the announcement." : null;
      modal("Post announcement", `<div class="field"><label for="f-ann">Announcement for all users</label><textarea id="f-ann" name="text" placeholder="e.g. Q4 accomplishment reports are due on December 15. Update your actuals and expenses before then."></textarea></div>`, fn, "Post"); break; }
    case "delete-ann": confirmBox("Delete announcement?", "It will disappear for all users.", "Delete", () => write(() => del("announcements", id), "Announcement deleted")); break;
    case "dismiss-ann": try { localStorage.setItem("uat-ann", id); } catch(e){} renderNotice(); break;
    case "delete-project": {
      const pr = find("projects");
      confirmBox("Delete project?", `“${esc(pr.title)}” and all its sub-activities, targets, budget records, updates and messages will be removed. This can't be undone.`, "Delete", async () => {
        const ok = await write(async () => {
          await del("projects", id);
        }, "Project deleted");
        if (ok) { state.selected = null; render(); }
      }); break; }
    case "delete-activity": { const a = find("activities"); confirmBox("Delete sub-activity?", `“${esc(a.name)}” will be removed. Updates logged under it stay, listed under the whole project.`, "Delete", () => write(() => del("activities", id), "Sub-activity deleted")); break; }
    case "delete-acc": confirmBox("Delete status update?", "This entry will be removed from the log.", "Delete", () => write(() => del("accomplishments", id), "Update deleted")); break;
    case "delete-target": confirmBox("Delete target?", "The indicator and its quarterly targets and actuals will be removed from reports.", "Delete", () => write(() => del("targets", id), "Target deleted")); break;
    case "delete-line": confirmBox("Delete budget line?", "Expenses recorded against it stay in the ledger without a line.", "Delete", () => write(() => del("budgetLines", id), "Budget line deleted")); break;
    case "delete-expense": confirmBox("Delete expense?", "The amount will be removed from utilization.", "Delete", () => write(() => del("expenses", id), "Expense deleted")); break;
  }
});
document.addEventListener("change", ev => {
  const id = ev.target.id;
  if (id === "catSel") { state.cat = ev.target.value; render(); }
  else if (id === "repYear") { state.rep.year = Number(ev.target.value); render(); }
  else if (id === "repCat") { state.rep.cat = ev.target.value; render(); }
  else if (id === "repScope") { state.rep.scope = ev.target.value; render(); }
  else if (id === "repUnit") { state.rep.unit = ev.target.value; render(); }
  else if (id === "repProject") { state.rep.project = ev.target.value; render(); }
  else if (id === "repFrom") { state.rep.from = ev.target.value; render(); }
  else if (id === "repTo") { state.rep.to = ev.target.value; render(); }
  else if (ev.target.dataset && ev.target.dataset.sig) { updateSig(ev.target); }
});
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && $("#modalRoot").innerHTML) closeModal(); });
$("#search").addEventListener("input", ev => { state.q = ev.target.value; renderList(); });

let toastT;
function toast(msg){ const el = $("#toast"); el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2800); }

render();
init();
})();
</script>
</body>
</html>
